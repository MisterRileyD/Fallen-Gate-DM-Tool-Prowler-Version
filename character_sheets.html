<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fallen Gate Character Sheets</title>
  <script src="./character_sheets_manifest.js"></script>
  <script src="./character_sheets.js"></script>
  <style>
:root {
  --page-bg: #f4e6c5;
  --page-line: #e7d4aa;
  --ink: #24170e;
  --purple: #4d245d;
  --gold: #c99739;
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  background:
    linear-gradient(90deg, rgba(0,0,0,0.10), transparent 7%, transparent 93%, rgba(0,0,0,0.10)),
    repeating-linear-gradient(0deg, var(--page-bg) 0 26px, var(--page-line) 27px 28px);
  overflow: hidden;
}

.embedded-book {
  height: 100%;
  padding: 8px;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 6px;
}

.book-toolbar,
.book-footer {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  padding: 8px;
  border: 1px solid rgba(90,61,20,0.26);
  border-radius: 12px;
  background: rgba(255,255,255,0.24);
}

.book-footer {
  justify-content: space-between;
  flex-wrap: nowrap;
}

.book-search {
  flex: 1;
  min-width: 150px;
  padding: 7px 10px;
  border: 1px solid #9b7b4e;
  border-radius: 9px;
  background: rgba(255,252,236,0.84);
  color: var(--ink);
  font-size: 14px;
}

.book-btn,
.index-card {
  padding: 7px 10px;
  border: 1px solid #6b3a13;
  border-radius: 9px;
  background: linear-gradient(#fff1c5, #d7b36a);
  color: #291609;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset;
}

.book-btn.dark {
  background: linear-gradient(#734589, #3a1a49);
  color: #ffe8a2;
  border-color: #d1a650;
}

.book-page-area {
  min-height: 0;
  height: 100%;
  overflow: hidden;
  border: 1px solid rgba(90,61,20,0.33);
  border-radius: 14px;
  background:
    linear-gradient(90deg, rgba(0,0,0,0.07), transparent 7%, transparent 93%, rgba(0,0,0,0.07)),
    repeating-linear-gradient(0deg, rgba(244,230,197,0.96) 0 26px, rgba(231,212,170,0.96) 27px 28px);
  box-shadow: inset 0 0 24px rgba(82,45,12,0.12);
}

.book-page {
  display: none;
  height: 100%;
  overflow-y: auto;
  padding: 14px 18px 16px;
  animation: pageTurn 260ms ease both;
}

.book-page.active { display: block; }

@keyframes pageTurn {
  from { opacity: 0; transform: translateX(22px) rotateY(-5deg); }
  to { opacity: 1; transform: translateX(0) rotateY(0); }
}

.item-title {
  margin: 0 0 8px;
  color: var(--purple);
  font-size: clamp(22px, 3.4vw, 32px);
  border-bottom: 2px solid rgba(97,60,23,0.34);
  padding-bottom: 5px;
}

.category {
  display: inline-block;
  margin: 4px 0 12px;
  padding: 4px 9px;
  border: 1px solid rgba(90,61,20,0.32);
  border-radius: 999px;
  background: rgba(255,255,255,0.28);
  color: #5a3a1a;
  font-weight: 900;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 12px;
}

.stats-line {
  margin: 8px 0 12px;
  padding: 9px 10px;
  border: 1px solid rgba(90,61,20,0.26);
  border-radius: 10px;
  background: rgba(255,255,255,0.28);
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 800;
  line-height: 1.45;
}

.section-title {
  margin: 14px 0 6px;
  color: #3f214b;
  font-weight: 900;
  font-size: 18px;
}

p, li {
  font-family: Arial, Helvetica, sans-serif;
  font-size: clamp(13px, 2.2vw, 16px);
  line-height: 1.45;
}

.index-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 10px;
}

.index-card {
  min-height: 78px;
  background: rgba(255,255,255,0.27);
  text-align: left;
}

.index-card strong {
  display: block;
  color: var(--purple);
  font-size: 18px;
  margin-bottom: 4px;
}

.sheet-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(90px, 1fr));
  gap: 10px;
}

.sheet-stat,
.inventory-card,
.known-card {
  padding: 8px 10px;
  border-radius: 10px;
  background: rgba(255,255,255,0.28);
  border: 1px solid rgba(90,61,20,0.22);
  font-family: Arial, Helvetica, sans-serif;
}

.sheet-stat {
  font-weight: 900;
  text-align: center;
}

.item-list {
  display: grid;
  gap: 8px;
}

.inventory-card strong,
.known-card strong {
  color: var(--purple);
}

.item-meta {
  display: block;
  color: #5a3a1a;
  font-size: 12px;
  margin-top: 2px;
}

.sheet-notes { white-space: pre-wrap; }

.empty {
  padding: 18px;
  text-align: center;
  font-weight: 900;
}

.page-count {
  color: #5a3a1a;
  font-weight: 900;
  font-family: Arial, Helvetica, sans-serif;
}

@media (max-width: 620px) {
  .sheet-grid { grid-template-columns: repeat(2, minmax(90px, 1fr)); }
}
  
.new-sheet-form-btn {
  background: linear-gradient(#fff1c5, #d7b36a);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #291609;
  border-color: #6b3a13;
}

.sheet-form-callout {
  margin: 10px 0 16px;
  padding: 12px 14px;
  border: 1px solid rgba(90,61,20,0.28);
  border-radius: 12px;
  background: rgba(255,255,255,0.28);
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 800;
}

.sheet-form-callout button {
  margin-top: 8px;
}

</style>
</head>
<body>
  <div class="embedded-book">
    <div class="book-toolbar">
      <a class="book-btn new-sheet-form-btn" href="./character_sheet_form.html">Sheet Form</a>
      <button class="book-btn dark" onclick="showSheetIndex()">Sheet Index</button>
      <input id="searchBox" class="book-search" placeholder="Search code, name, spell, skill, item..." oninput="renderSheets()">
      <button class="book-btn dark" onclick="addTypedCode()">Add Code</button>
      <button class="book-btn" onclick="copySelectedCode()">Copy Code</button>
    </div>

    <main class="book-page-area" id="pageStage"></main>

    <footer class="book-footer">
      <button class="book-btn" onclick="showSheetIndex()">Index</button>
      <button class="book-btn" onclick="prevPage()">← Back</button>
      <button class="book-btn dark" onclick="nextPage()">Next →</button>
      <span id="pageCount" class="page-count">Page 1</span>
    </footer>
  </div>

  <script>
    let sheets = window.FALLEN_GATE_CHARACTER_SHEETS || {};
    let allPages = [];
    let filteredPages = [];
    let currentPage = 0;

    function sortedCodes() {
      return Object.keys(sheets).sort(function (a, b) {
        return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
      });
    }

    function showSheetIndex() {
      const page = document.getElementById("sheet_index");
      if (!page) return;
      filteredPages = allPages.slice();
      const index = filteredPages.indexOf(page);
      showPage(index >= 0 ? index : 0);
    }

    function normalizeList(value) {
      if (!value) return [];

      if (Array.isArray(value)) {
        return value;
      }

      return [value];
    }

    function itemName(item) {
      if (typeof item === "string") return item;
      return item.name || item.title || "Unnamed";
    }

    function itemDetail(item) {
      if (typeof item === "string") return "";

      const parts = [];

      if (item.category) parts.push(item.category);
      if (item.family) parts.push(item.family);
      if (item.race) parts.push("Race: " + item.race);
      if (item.tier) parts.push(item.tier);
      if (item.type) parts.push(item.type);
      if (item.cost) parts.push("Cost: " + item.cost);
      if (item.damage) parts.push("Damage: " + item.damage);
      if (item.bonus) parts.push("Bonus: " + item.bonus);
      if (item.amount) parts.push("Amount: " + item.amount);
      if (item.description) parts.push(item.description);

      return parts.join(" | ");
    }

    function renderItemList(items, emptyText, cardClass) {
      const list = normalizeList(items);

      if (list.length === 0) {
        return '<div class="empty">' + escapeHtml(emptyText) + '</div>';
      }

      return '<div class="item-list">' + list.map(function (item) {
        const detail = itemDetail(item);
        return `
          <div class="${cardClass}">
            <strong>${escapeHtml(itemName(item))}</strong>
            ${detail ? `<span class="item-meta">${escapeHtml(detail)}</span>` : ""}
          </div>
        `;
      }).join("") + '</div>';
    }

    function renderSheets() {
      const q = document.getElementById("searchBox").value.trim().toLowerCase();
      const stage = document.getElementById("pageStage");

      const codes = sortedCodes().filter(function (code) {
        const s = sheets[code];
        const haystack = [
          code,
          s.name,
          s.rank,
          s.type,
          s.notes,
          s.race,
          s.raceFamily,
          JSON.stringify(s.raceAbilities || []),
          JSON.stringify(s.spells || []),
          JSON.stringify(s.warriorSkills || s.skills || []),
          JSON.stringify(s.inventory || {}),
          JSON.stringify(s.weapons || []),
          JSON.stringify(s.jewelry || [])
        ].join(" ").toLowerCase();

        return !q || haystack.includes(q);
      });

      let indexContent = "";
      if (codes.length === 0) {
        indexContent = '<div class="empty">No official character sheets listed yet. Add sheet files beside index.html, then list them in character_sheets_manifest.js.</div>';
      } else {
        indexContent = '<div class="index-list">' + codes.map(function (code) {
          const s = sheets[code];
          return `
            <button class="index-card" onclick="goToSheet('${escapeAttr(code)}')">
              <strong>${escapeHtml(code)}</strong>
              ${escapeHtml(s.name || code)}
            </button>
          `;
        }).join("") + '</div>';
      }

      let pages = `
        <section class="book-page active" id="sheet_index">
          <h2 class="item-title">Sheet Index</h2>
          <div class="category">Sorted by sheet code</div>
          ${indexContent}
        </section>
      `;

      pages += codes.map(function (code) {
        const s = sheets[code];
        const inventory = s.inventory || {};
        const jewelry = inventory.jewelry || s.jewelry || [];
        const weapons = inventory.weapons || s.weapons || [];
        const spells = s.spells || [];
        const warriorSkills = s.warriorSkills || s.skills || [];
        const raceAbilities = s.raceAbilities || [];

        return `
          <section class="book-page" id="sheet_${escapeAttr(code)}">
            <h2 class="item-title">${escapeHtml(s.name || code)}</h2>
            <div class="category">Sheet Code: ${escapeHtml(code)}</div>
            <div class="stats-line">${escapeHtml(s.rank || s.type || "No rank selected")}</div>

            <div class="sheet-grid">
              <div class="sheet-stat">Body<br>${emptyDash(s.body)}</div>
              <div class="sheet-stat">Mind<br>${emptyDash(s.mind)}</div>
              <div class="sheet-stat">Spirit<br>${emptyDash(s.spirit)}</div>
              <div class="sheet-stat">Bonus<br>${formatBonus(s.bonus)}</div>
            </div>

            <div class="section-title">Race</div>
            <div class="inventory-card"><strong>${escapeHtml(s.race || "No race selected.")}</strong>${s.raceFamily ? `<span class="item-meta">${escapeHtml(s.raceFamily)}${s.raceTier ? " | " + escapeHtml(s.raceTier) : ""}</span>` : ""}</div>

            <div class="section-title">Race Abilities</div>
            ${renderItemList(raceAbilities, "No race abilities listed.", "known-card")}

            <div class="section-title">Spells Known</div>
            ${renderItemList(spells, "No spells listed.", "known-card")}

            <div class="section-title">Warrior Skills Known</div>
            ${renderItemList(warriorSkills, "No warrior skills listed.", "known-card")}

            <div class="section-title">Inventory — Jewelry</div>
            ${renderItemList(jewelry, "No jewelry listed.", "inventory-card")}

            <div class="section-title">Inventory — Weapons</div>
            ${renderItemList(weapons, "No weapons listed.", "inventory-card")}

            <div class="section-title">Notes</div>
            <p class="sheet-notes">${escapeHtml(s.notes || "No notes.")}</p>

            <button class="book-btn dark" onclick="sendSheet('${escapeAttr(code)}')">Add This Sheet to Encounter</button>
          </section>
        `;
      }).join("");

      stage.innerHTML = pages;
      allPages = Array.from(document.querySelectorAll(".book-page"));
      filteredPages = allPages.slice();
      showPage(0);
    }

    function goToSheet(code) {
      const page = document.getElementById("sheet_" + code);
      if (!page) return;
      filteredPages = allPages.slice();
      const index = filteredPages.indexOf(page);
      showPage(index >= 0 ? index : 0);
    }

    function showPage(index) {
      if (filteredPages.length === 0) return;
      if (index < 0) index = filteredPages.length - 1;
      if (index >= filteredPages.length) index = 0;
      currentPage = index;
      allPages.forEach(p => p.classList.remove("active"));
      filteredPages[currentPage].classList.add("active");
      updateCount();
    }

    function nextPage() { showPage(currentPage + 1); }
    function prevPage() { showPage(currentPage - 1); }

    function updateCount() {
      document.getElementById("pageCount").textContent =
        filteredPages.length ? "Page " + (currentPage + 1) + " of " + filteredPages.length : "No pages";
    }

    function addTypedCode() {
      const code = document.getElementById("searchBox").value.trim().toUpperCase();

      if (!code) {
        alert("Type a sheet code first.");
        return;
      }

      if (!sheets[code]) {
        alert("No sheet found for code: " + code);
        return;
      }

      sendSheet(code);
    }

    function sendSheet(code) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "addCharacterSheet", code: code }, "*");
      }
      document.getElementById("searchBox").value = code;
    }

    function copySelectedCode() {
      const code = document.getElementById("searchBox").value.trim().toUpperCase();

      if (!code) {
        alert("Type or select a code first.");
        return;
      }

      navigator.clipboard.writeText(code).then(function () {
        alert("Copied code: " + code);
      });
    }

    function emptyDash(value) {
      return value === "" || value === null || value === undefined ? "-" : escapeHtml(value);
    }

    function formatBonus(value) {
      if (value === "" || value === null || value === undefined) return "-";
      const number = Number(value);
      if (!Number.isNaN(number) && number > 0) return "+" + number;
      return escapeHtml(value);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }


    function refreshCharacterSheetIndex() {
      sheets = window.FALLEN_GATE_CHARACTER_SHEETS || {};
      renderSheets();
    }

    window.addEventListener("fallenGateCharacterSheetsReady", refreshCharacterSheetIndex);

    // Extra fallback in case the sheet file loads just after the first render.
    setTimeout(refreshCharacterSheetIndex, 400);
    setTimeout(refreshCharacterSheetIndex, 1200);

    window.addEventListener("DOMContentLoaded", renderSheets);
  </script>
</body>
</html>
