<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fallen Gate Race Ability Guide</title>
  <style>
:root {
  --page-bg: #f4e6c5;
  --page-line: #e7d4aa;
  --ink: #24170e;
  --purple: #4d245d;
  --gold: #c99739;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body {
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  background:
    linear-gradient(90deg, rgba(0,0,0,0.10), transparent 7%, transparent 93%, rgba(0,0,0,0.10)),
    repeating-linear-gradient(0deg, var(--page-bg) 0 26px, var(--page-line) 27px 28px);
  overflow: hidden;
}
.embedded-book {
  height: 100%;
  padding: 8px;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 6px;
}
.book-toolbar, .book-footer {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  padding: 8px;
  border: 1px solid rgba(90,61,20,0.26);
  border-radius: 12px;
  background: rgba(255,255,255,0.24);
}
.book-footer { justify-content: space-between; flex-wrap: nowrap; }
.book-search {
  flex: 1;
  min-width: 150px;
  padding: 7px 10px;
  border: 1px solid #9b7b4e;
  border-radius: 9px;
  background: rgba(255,252,236,0.84);
  color: var(--ink);
  font-size: 14px;
}
.book-btn, .race-card, .ability-btn {
  padding: 7px 10px;
  border: 1px solid #6b3a13;
  border-radius: 9px;
  background: linear-gradient(#fff1c5, #d7b36a);
  color: #291609;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset;
}
.book-btn.dark {
  background: linear-gradient(#734589, #3a1a49);
  color: #ffe8a2;
  border-color: #d1a650;
}
.book-page-area {
  min-height: 0;
  height: 100%;
  overflow: hidden;
  border: 1px solid rgba(90,61,20,0.33);
  border-radius: 14px;
  background:
    linear-gradient(90deg, rgba(0,0,0,0.07), transparent 7%, transparent 93%, rgba(0,0,0,0.07)),
    repeating-linear-gradient(0deg, rgba(244,230,197,0.96) 0 26px, rgba(231,212,170,0.96) 27px 28px);
  box-shadow: inset 0 0 24px rgba(82,45,12,0.12);
}
.book-page {
  display: none;
  height: 100%;
  overflow-y: auto;
  padding: 14px 18px 16px;
  animation: pageTurn 260ms ease both;
}
.book-page.active { display: block; }
@keyframes pageTurn {
  from { opacity: 0; transform: translateX(22px) rotateY(-5deg); }
  to { opacity: 1; transform: translateX(0) rotateY(0); }
}
.item-title {
  margin: 0 0 8px;
  color: var(--purple);
  font-size: clamp(22px, 3.4vw, 32px);
  border-bottom: 2px solid rgba(97,60,23,0.34);
  padding-bottom: 5px;
}
.category {
  display: inline-block;
  margin: 4px 0 12px;
  padding: 4px 9px;
  border: 1px solid rgba(90,61,20,0.32);
  border-radius: 999px;
  background: rgba(255,255,255,0.28);
  color: #5a3a1a;
  font-weight: 900;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 12px;
}
p, li, td, th {
  font-family: Arial, Helvetica, sans-serif;
  font-size: clamp(13px, 2.2vw, 16px);
  line-height: 1.45;
}
.race-grid, .ability-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
  gap: 10px;
  margin-top: 10px;
}
.race-card {
  min-height: 92px;
  background: rgba(255,255,255,0.27);
  text-align: left;
}
.race-card strong, .ability-btn strong {
  display: block;
  color: var(--purple);
  font-size: 18px;
  margin-bottom: 4px;
}
.ability-btn {
  display: block;
  width: 100%;
  margin: 5px 0;
  background: rgba(255,255,255,0.32);
  color: #3b1d45;
  text-align: left;
}
.ability-btn small {
  display: block;
  color: #5a3a1a;
  font-weight: 700;
  margin-top: 3px;
}
.field-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
  background: rgba(255,255,255,0.20);
  border-radius: 10px;
  overflow: hidden;
}
.field-table th {
  width: 150px;
  color: #3f214b;
  text-align: left;
  vertical-align: top;
}
.field-table th, .field-table td {
  padding: 7px 8px;
  border-bottom: 1px solid rgba(90,61,20,0.18);
}
.preserve-lines { white-space: pre-wrap; }
.page-count {
  color: #5a3a1a;
  font-weight: 900;
  font-family: Arial, Helvetica, sans-serif;
}
</style>
</head>
<body>
  <div class="embedded-book">
    <div class="book-toolbar">
      <button class="book-btn dark" onclick="goToPage('race_index')">Race Index</button>

      <button class="book-btn dark" onclick="nextPage()">Next</button>

    <main class="book-page-area" id="pageStage"></main>
    <footer class="book-footer">

      <button class="book-btn" onclick="prevPage()">← Back</button>
      <button class="book-btn dark" onclick="nextPage()">Next →</button>
      <span id="pageCount" class="page-count">Page 1</span>
    </footer>
  </div>

.", "autoHit": "Yes", "friendlyFire": "N/A", "description": "The Sphinx points at their target and speaks a riddle, Cursing their intended target to puzzle over the riddle before they can take most other actions.\nThe Target rolls a DC:13 without modifiers to determine if they can come up with an answer to the riddle to avoid the effects of this Curse. The Target cannot Attack, Cast Spells, or use Abilities until they solve the riddle (pass the DC) on their Turn. The Target may still Defend and benefit from existing Passive Spells and Abilities.\nFor an Arch-Sphinx, the Spell DC is increased to 16 without modifiers.\nOnly one Target may be affected by this ability at any given time.\nTargets without a Spoken Language as well as Mindless Undead and Automatons are Immune (DM discretion.)\nThis Minor Curse breaks if the Target is Attacked by the Sphinx.", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Imbue Weapon", "sourceName": "Imbue Weapon", "category": "Demonic", "whoCanCast": "Tiefling, Devil, Fiend, Archdemon, Abyssal Hellhound, Arch-Sphinx --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until combat ends.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Dark Presence", "sourceName": "Dark Presence", "category": "Sphinx", "whoCanCast": "Arch-Sphinx --------------------", "cost": "Free", "duration": "Permanent", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The Arch-Sphinx is a being of dark beauty and an intimidating presence that causes those that would bring harm to them to fumble and falter out of Fear.\nThe Arch-Sphinx has a dark aura with a 30 Foot Radius, which inflicts a -2 penalty to ALL DC Rolls made by Enemies in their presence.\nThis is a Fear Effect and cannot affect those of a Higher Rank.\nMindless Undead and Automatons are Immune.", "sourceFile": "👿-demonic-abilities.txt"}]}, "Shadewalker": {"name": "Shadewalker", "family": "Demonic", "tier": "Advanced Demonic", "abilities": [{"name": "Shadow Sight", "sourceName": "Shadow Prowler Shadow Sight", "category": "Demonic", "whoCanCast": "Shadow Prowler, Shadewalker -------------------------------------------------------------", "cost": "Free", "duration": "Permanent", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Born of the Shadow Realm, Shadow Prowler’s have Shadow Sight, the ability to see without any source of light and through any type of darkness, even supernatural. Things seen within these variations of darkness will be seen in a black and white spectrum.\nThis renders the Shadow Prowler immune to the effects of the spell Umbra Integumentum (Shadow Cover).\nThe Shadow Prowler can see characters attempting to use Umbra Ambulate (Shadow Walk) or the Shadow Prowler’s Shadow Prowl as a stealth mechanic.\nThis does NOT affect the bonuses of Umbra Ambulate (Shadow Walk) or Shadow Prowl when used as part of an attack.\nThis ability does not count as a spell.\nThis has all of the same effects as the spell Visus Tenebrosus (Shadow Sight), and is permanently active in both of the Shadow Prowler forms.", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Shadow Prowler War Form", "sourceName": "Shadow Prowler War Form", "category": "Demonic", "whoCanCast": "Shadow Prowler, Shadewalker ---------------------------------------------------", "cost": "Free", "duration": "As long as the Shadow Prowler wishes", "autoHit": "N/A", "friendlyFire": "N/A", "description": "A Shadow Prowler's four-legged War Form is a true sight to behold as they become a great hunting cat with a body blended of dark fur and magical shadow with claws and teeth that are black and sharp like obsidian.\nThe Shadow Prowler War Form can attack twice in one round, either with two claw attacks, or a claw and a bite. They are able to surprise attack their foe (Shadow Prowl) and are imbued with the superstitious luck of cats known as nine lives (Nine Lives). The War Form’s movement is 60 feet per Round/Minute. This form will last for as long as the Shadow Prowler wishes.\nShadow Prowler War Form gains the following Shadow Prowler Abilities:\nShadow Prowler War Form Claws, Shadow Prowler War Form Bite, Shadow Prowl, Nine Lives, Weakness: Holy Light\nThis ability takes one (1) full Round/Minute to fully transform IN COMBAT.\nBecause of the strain of a fast shapeshift in combat situations on the body, you can only shapeshift ONCE in combat, either into or out of War Form.\nNormal out-of-combat shapeshifting should take about five minutes of normal roleplay.\n(This is to allow for players to change tactics in combat between being a spell caster or heavy melee without allowing the player to change at their whimsy every other Round.)\nAll buffs and armor pre-cast before taking on this form are suspended until the effect ends, and then they are restored. Buffs from Jewelry and potions remain active\nA Shadow Prowler cannot cast spells while in this form\nThis counts as a Spell during the transformation process and may be countered, but once the change is complete it may not be dispelled", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "War Form Claws", "sourceName": "Shadow Prowler War Form Claws", "category": "Demonic", "whoCanCast": "Shadow Prowler War Form -----------------------------------------------------------------------------------------------------------------------------------------------------------", "cost": "Free (must be in Shadow Prowler War Form)", "duration": "Untill dismissed", "autoHit": "No", "friendlyFire": "N/A", "description": "A Shadow Prowler Claws can be used to slice open their prey with ease. Those struck will take an initial 2 Body, 2 Spirit Damage and must also roll a DC: 11 or become infected with a severe fever adding 1 Body and Spirit Damage per round till the DC is beaten.\nPurgo Caro (Purge Impurities of the Flesh) spell can also be cast to cure the fever.\nDoes not count as a spell", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "War Form Bite", "sourceName": "Shadow Prowler War Form Bite", "category": "Demonic", "whoCanCast": "Shadow Prowler War Form -----------------------------------------------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until dismissed", "autoHit": "No", "friendlyFire": "N/A", "description": "A Shadow Prowler's War Form Bite is quite savage indeed. Anyone suffering a bite from those powerful jaws will take 1 Body and 2 Spirit and must also make a DC: 11 or lose an extra 1 Body and 1 Spirit from the damage caused.\nDoes not count as spell", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Nine Lives", "sourceName": "Nine Lives", "category": "Demonic", "whoCanCast": "Shadow Prolwer War Form -----------------------------------------------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Duration of the War Form", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The Shadow Prowler is imbued with a certain level of ‘Luck’ in that they will have a +2 to their Combat Rolls in this form. Any roll of (1) is rerolled and all DC checks get another roll if the first one fails.", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Form Mastery", "sourceName": "Form Mastery", "category": "Lycan, Demonic", "whoCanCast": "Lycan Pack Leader, Shadewalker ----------------------- ----------", "cost": "Free", "duration": "As long as the user wishes.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The character is able to manipulate their bodies to take on aspects of their War Form without fully transforming. They may use War Form attacks (Claw and Bite) and movement (60 feet per Round), without undergoing a full transformation. This partial transformation is instant and the character is allowed to move and make an immediate attack in addition to using this ability. \nThis does not count as spell.\nThis does NOT bestow the AC 8 or the doubling of stats from Lycan War Form.\nThis does NOT bestow Nine Lives or the +2 bonus to Attack and Defense from Shadow Prowler War From.", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Apex Predator", "sourceName": "Apex Predator", "category": "Lycan, Demonic", "whoCanCast": "Lycan Pack Leader, Shadewalker --------------------------------------------------------------", "cost": "None", "duration": "Permanent", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The claws and teeth of an apex predator are more deadly than most.\nThis character’s War Form also gains a +2 bonus to Attack and Defense.", "sourceFile": "Lycan Abilites.txt"}, {"name": "Primal Roar", "sourceName": "Primal Roar", "category": "Lycan, Demonic", "whoCanCast": "Lycan Pack Leader, Shadewalker", "cost": "None", "duration": "Instant", "autoHit": "Yes", "friendlyFire": "N/A", "description": "The roar of an apex predator echoes through the battlefield inducing fear in their enemies. All enemies who can hear the roar must roll a DC: 10 or suffer 3 Spirit Damage. Further more enemies that take half or more of their base Spirit in Damage from this ability will be frozen in fear and lose their next Round.\nThis may only be used ONCE PER COMBAT per character in War Form.", "sourceFile": "Lycan Abilites.txt"}, {"name": "One with Shadows", "sourceName": "One with Shadow", "category": "Demonic", "whoCanCast": "Shadewalker ---------------------------------------------", "cost": "Per Spell", "duration": "Per Spell", "autoHit": "Per Spell", "friendlyFire": "Per Spell", "description": "In becoming a Shadewalker, the Shadow Prowler has grown closer to the darkness of their home and shadows seem to willingly bend to their will at all times.\nShadewalker’s are able to cast and maintain the following Shadow Spells innately without incantations and movements in War Form if they have been learned. The +2 Bonus gained in War Form now applies to casting Shadow Spells.\nShadow Spells available in War Form:\nUmbra Vincla (Shadow Bind)\nImperium Umbrae (Control Shadows)\nMutatio Obscura (Dark Transformation)\nUmbra Fulmen (Shadow Lightning)\nUmbra Integumentum (Shadow Cover)\nUmbra Didymus (Shadow Twin)\nUmbra Exilium (Shadow Exile)\nUmbra Hirudo (Shadow Leech, Oracle Spell)\nNew spells will be assessed on a case by case basis.", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Weakness: Holy Light", "sourceName": "Weakness: Holy Light", "category": "Demonic", "whoCanCast": "All demonic beings: Succubus, Incubus, Hellhound, Abyssal Hellhound, Shadow Prowler (War Form only), Shadewalker (War Form Only) Devil, Fiend, Archdemon, Sphinx,, Arch-Sphinx (this is not an exhaustive list). --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The cleansing light of the Creator is anathema to the existence of demons and demonic beings. All demonic beings will take double damage from Holy Light spells ⁠unknown or Holy Vengeance weapons ⁠unknown \nDoes not count as spell", "sourceFile": "👿-demonic-abilities.txt"}]}, "Wildbrand Hound": {"name": "Wildbrand Hound", "family": "Demonic", "tier": "Advanced Demonic", "abilities": [{"name": "Lunar War Form", "sourceName": "Lunar War Form", "category": "👿-demonic-abilities", "whoCanCast": "N/A", "cost": "N/A", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The Lunar War Form is a haunting sight, a spectral manifestation of Luna's true nature as the Hunt's chosen wraith. Her body dissolves into a silhouette of flickering moonlight and dark flame. Silver fire courses through semi-transparent veins, and her eyes burn like twin eclipses suspended in shadow. She moves without sound, her presence chilling and divine. In this form, Luna becomes a living wraith of moonfire and ash. The form lasts as long as Luna wills, though the longer she remains in it, the more her mortal essence fades beneath the cold burn of lunar energy, loosing herself becoming the original iteration of the wild hunt. She can attack twice per round either two claw strikes or one claw and one bite. Her Body, Mind, and Spirit are doubled, and her armor becomes AC: 8 (Ethereal). Luna's movement speed increases to 60 feet per Turn, allowing her to glide, flicker, and partially phase through thin walls or barriers.\nLunar War Form grants access to the following abilities:\nLunar Claws, Lunar Bite, Eclipse Howl, and Lunar Ascension\nWraithly Traits:\nLuna counts as both Ethereal and Material, allowing her to phase through non-magical obstacles. She can attack both material and ethereal (ghostly) targets, and can be targeted by attacks from such beings. She is also vulnerable to attacks crossing the barrier, such as Spectral Arrow.\nHer voice becomes an echo, capable of being heard from any direction within 30ft.\n---------------------------------", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Lunar Bite", "sourceName": "Lunar Bite", "category": "Demon", "whoCanCast": "Wildbrand Hound Lunar Warform ----------------------", "cost": "Free", "duration": "Instant", "autoHit": "No", "friendlyFire": "No", "description": "Luna's teeth cut like razors and jaws crush like a vice, her victims lose parts of their soul piece by piece. This bite deals 2 Body and 2 Spirit damage and restores 1 Body to Luna as she draws strength from her prey. If this attack is used to kill or destroy the target, Luna gains the full damage dealt as Healing.\nDoes not count as spell.", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Lunar Claws", "sourceName": "Lunar Claws", "category": "Demon", "whoCanCast": "Wildbrand Hound ----------------------", "cost": "Free", "duration": "Instant", "autoHit": "No", "friendlyFire": "No", "description": "Luna’s claws become extensions of lunar flame. Each strike inflicts 2 Body and 1 Spirit damage.\nIn Lunar War Form, the claws burn brighter dealing 3 Body and 2 Spirit damage.\nDoes not count as spell.", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Lunar Ascension", "sourceName": "Lunar Ascension", "category": "Demon", "whoCanCast": "Wildbrand Hound Lunar Warform ----------------------", "cost": "Free", "duration": "2 Attacks", "autoHit": "N/A", "friendlyFire": "N/A", "description": "When surrounded by battle, Luna enters a heightened state — her claws and eyes glow white. Luna's attacks gain +2 Spirit damage for 2 Attacks.\nThis ability may only be used Once per Combat scene.", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Moonfire Breath", "sourceName": "Moonfire Breath", "category": "Demon", "whoCanCast": "Wildbrand Hound ----------------------", "cost": "2 Spirit", "duration": "Instant", "autoHit": "No", "friendlyFire": "Yes", "description": "Luna unleashes a cone of moon-touched fire that shimmers between radiant silver and dark violet, searing both flesh and spirit.\nThe cone is 15ft wide and 30ft long and anyone caught within the flames takes 2 Body and 2 Spirit Damage.\nWhen in Lunar War Form, the attack intensifies into Eclipse Burst — the fire turns blinding white with streaks of black.\nThe cone expands in size to a 90 degree cone that is 40ft long dealing 3 Body and 3 Spirit Damage.\nVictims of either version of the attack must roll DC:10 or be Knocked Prone and Blinded by the flash of celestial flame.", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Walk on the Dark Side", "sourceName": "Walk on the Dark Side", "category": "Demon", "whoCanCast": "Wildbrand Hound ----------------------", "cost": "Free/2 Spirit", "duration": "As long as the Caster wishes", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Luna may become Ethereal or step into the Spirit Realm at will.\nEthereal: Luna may choose to be Ethereal at will for no cost.\nWhile in this state, Luna becomes immune to attacks, but this effect can be Dispelled.\nShe cannot make physical contact, or hold anything, but can cast spells and have spells cast upon her.\nLuna can interact normally with and physically attack another that is Ethereal.\nSpirit Realm: Luna may step into or out of the Spirit Realm at a cost of 2 Spirit.\nLuna may carry personal items freely in the Spirit Realm and does not lose them stepping across.\nIf Luna is reduced to 0 Spirit while in the Spirit Realm, their body remains stranded there and must be retrieved before they can be revived.", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Eclipse Howl", "sourceName": "Eclipse Howl", "category": "Demon", "whoCanCast": "Wildbrand Hound Lunar Warform ----------------------", "cost": "Free", "duration": "2 Rounds", "autoHit": "Yes", "friendlyFire": "No", "description": "Luna raises her head and releases a thunderous lunar howl. Enemies within 30ft must roll DC: 10 or be Frightened by Luna for 2 rounds. The affected Targets deal one less Body Damage with Attacks. They also have -2 to Attack Rolls against Luna and cannot move closer to her.", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Apex Predator", "sourceName": "Apex Predator", "category": "Lycan, Demonic", "whoCanCast": "Lycan Pack Leader, Shadewalker --------------------------------------------------------------", "cost": "None", "duration": "Permanent", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The claws and teeth of an apex predator are more deadly than most.\nThis character’s War Form also gains a +2 bonus to Attack and Defense.", "sourceFile": "Lycan Abilites.txt"}, {"name": "Weakness: Holy Light", "sourceName": "Weakness: Holy Light", "category": "Demonic", "whoCanCast": "All demonic beings: Succubus, Incubus, Hellhound, Abyssal Hellhound, Shadow Prowler (War Form only), Shadewalker (War Form Only) Devil, Fiend, Archdemon, Sphinx,, Arch-Sphinx (this is not an exhaustive list). ----- , "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Hellfire Breath", "sourceName": "Hellfire Breath", "category": "Demonic", "whoCanCast": "Hellhound, Abyssal Hellhound --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until healed.", "autoHit": "No", "friendlyFire": "Yes", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Demonic Speed", "sourceName": "Demonic Speed", "category": "Demonic", "whoCanCast": "Hellhound, Abyssal Hellhound, Shadow Prowler (human form) --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Permanent", "autoHit": "N/A", "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Weakness: Holy Light", "sourceName": "Weakness: Holy Light", "category": "Demonic", "whoCanCast": "All demonic beings: Succubus, Incubus, Hellhound, Abyssal Hellhound, Shadow Prowler (War Form only), Shadewalker (War Form Only) Devil, Fiend, Archdemon, Sphinx,, Arch-Sphinx (this is not an exhaustive list). --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The cleansing light of the Creator is anathema to the existence of demons and demonic beings. All demonic beings will take double damage from Holy Light spells ⁠unknown or Holy Vengeance weapons ⁠unknown \nDoes not count as spell", "sourceFile": "👿-demonic-abilities.txt"}]}, "Incubus/Succubus": {"name": "Incubus/Succubus", "family": "Demonic", "tier": "Base", "abilities": [{"name": "Demonic Claws", "sourceName": "Demonic Claws", "category": "Demonic", "whoCanCast": "Tiefling, Succubus, Incubus, Hellhound, Abyssal Hellhound, Devil, Fiend, Archdemon, Sphinx, Arch-Sphinx --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until dismissed.", "autoHit": "No", "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Soul Draining Kiss", "sourceName": "Soul Draining Kiss", "category": "Demonic", "whoCanCast": "Succubus, Incubus, Advanced Succubus --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until depleted or escaped.", "autoHit": "No", "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Demonic Flight", "sourceName": "Demonic Flight", "category": "Demonic", "whoCanCast": "Succubus, Incubus, Devil, Fiend, Archdemon, Sphinx, Arch-Sphinx --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Dream Walking", "sourceName": "Dream Walking", "category": "Demonic", "whoCanCast": "Succubus, Incubus, Advanced Succubus --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "1 Day", "autoHit": "Yes", "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Shapeshifting", "sourceName": "Shapeshifting", "category": "Demonic", "whoCanCast": "Tiefling, Succubus, Incubus, Devil, Fiend, Archdemon, Sphinx, Arch-Sphinx --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "N/A", "autoHit": "Yes", "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Weakness: Holy Light", "sourceName": "Weakness: Holy Light", "category": "Demonic", "whoCanCast": "All demonic beings: Succubus, Incubus, Hellhound, Abyssal Hellhound, Shadow Prowler (War Form only), Shadewalker (War Form Only) Devil, Fiend, Archdemon, Sphinx,, Arch-Sphinx (this is not an exhaustive list). --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The cleansing light of the Creator is anathema to the existence of demons and demonic beings. All demonic beings will take double damage from Holy Light spells ⁠unknown or Holy Vengeance weapons ⁠unknown \nDoes not count as spell", "sourceFile": "👿-demonic-abilities.txt"}]}, "Shadow Prowler": {"name": "Shadow Prowler", "family": "Demonic", "tier": "Base", "abilities": [{"name": "Shadow Sight", "sourceName": "Shadow Prowler Shadow Sight", "category": "Demonic", "whoCanCast": "Shadow Prowler, Shadewalker -------------------------------------------------------------", "cost": "Free", "duration": "Permanent", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Born of the Shadow Realm, Shadow Prowler’s have Shadow Sight, the ability to see without any source of light and through any type of darkness, even supernatural. Things seen within these variations of darkness will be seen in a black and white spectrum.\nThis renders the Shadow Prowler immune to the effects of the spell Umbra Integumentum (Shadow Cover).\nThe Shadow Prowler can see characters attempting to use Umbra Ambulate (Shadow Walk) or the Shadow Prowler’s Shadow Prowl as a stealth mechanic.\nThis does NOT affect the bonuses of Umbra Ambulate (Shadow Walk) or Shadow Prowl when used as part of an attack.\nThis ability does not count as a spell.\nThis has all of the same effects as the spell Visus Tenebrosus (Shadow Sight), and is permanently active in both of the Shadow Prowler forms.", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Shadow Prowler War Form", "sourceName": "Shadow Prowler War Form", "category": "Demonic", "whoCanCast": "Shadow Prowler, Shadewalker ---------------------------------------------------", "cost": "Free", "duration": "As long as the Shadow Prowler wishes", "autoHit": "N/A", "friendlyFire": "N/A", "description": "A Shadow Prowler's four-legged War Form is a true sight to behold as they become a great hunting cat with a body blended of dark fur and magical shadow with claws and teeth that are black and sharp like obsidian.\nThe Shadow Prowler War Form can attack twice in one round, either with two claw attacks, or a claw and a bite. They are able to surprise attack their foe (Shadow Prowl) and are imbued with the superstitious luck of cats known as nine lives (Nine Lives). The War Form’s movement is 60 feet per Round/Minute. This form will last for as long as the Shadow Prowler wishes.\nShadow Prowler War Form gains the following Shadow Prowler Abilities:\nShadow Prowler War Form Claws, Shadow Prowler War Form Bite, Shadow Prowl, Nine Lives, Weakness: Holy Light\nThis ability takes one (1) full Round/Minute to fully transform IN COMBAT.\nBecause of the strain of a fast shapeshift in combat situations on the body, you can only shapeshift ONCE in combat, either into or out of War Form.\nNormal out-of-combat shapeshifting should take about five minutes of normal roleplay.\n(This is to allow for players to change tactics in combat between being a spell caster or heavy melee without allowing the player to change at their whimsy every other Round.)\nAll buffs and armor pre-cast before taking on this form are suspended until the effect ends, and then they are restored. Buffs from Jewelry and potions remain active\nA Shadow Prowler cannot cast spells while in this form\nThis counts as a Spell during the transformation process and may be countered, but once the change is complete it may not be dispelled", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "War Form Claws", "sourceName": "Shadow Prowler War Form Claws", "category": "Demonic", "whoCanCast": "Shadow Prowler War Form -----------------------------------------------------------------------------------------------------------------------------------------------------------", "cost": "Free (must be in Shadow Prowler War Form)", "duration": "Untill dismissed", "autoHit": "No", "friendlyFire": "N/A", "description": "A Shadow Prowler Claws can be used to slice open their prey with ease. Those struck will take an initial 2 Body, 2 Spirit Damage and must also roll a DC: 11 or become infected with a severe fever adding 1 Body and Spirit Damage per round till the DC is beaten.\nPurgo Caro (Purge Impurities of the Flesh) spell can also be cast to cure the fever.\nDoes not count as a spell", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "War Form Bite", "sourceName": "Shadow Prowler War Form Bite", "category": "Demonic", "whoCanCast": "Shadow Prowler War Form -----------------------------------------------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until dismissed", "autoHit": "No", "friendlyFire": "N/A", "description": "A Shadow Prowler's War Form Bite is quite savage indeed. Anyone suffering a bite from those powerful jaws will take 1 Body and 2 Spirit and must also make a DC: 11 or lose an extra 1 Body and 1 Spirit from the damage caused.\nDoes not count as spell", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Nine Lives", "sourceName": "Nine Lives", "category": "Demonic", "whoCanCast": "Shadow Prolwer War Form -----------------------------------------------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Duration of the War Form", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The Shadow Prowler is imbued with a certain level of ‘Luck’ in that they will have a +2 to their Combat Rolls in this form. Any roll of (1) is rerolled and all DC checks get another roll if the first one fails.", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Weakness: Holy Light", "sourceName": "Weakness: Holy Light", "category": "Demonic", "whoCanCast": "All demonic beings: Succubus, Incubus, Hellhound, Abyssal Hellhound, Shadow Prowler (War Form only), Shadewalker (War Form Only) Devil, Fiend, Archdemon, Sphinx,, Arch-Sphinx (this is not an exhaustive list). --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The cleansing light of the Creator is anathema to the existence of demons and demonic beings. All demonic beings will take double damage from Holy Light spells ⁠unknown or Holy Vengeance weapons ⁠unknown \nDoes not count as spell", "sourceFile": "👿-demonic-abilities.txt"}]}, "Sphinx": {"name": "Sphinx", "family": "Demonic", "tier": "Base", "abilities": [{"name": "Demonic Claws", "sourceName": "Demonic Claws", "category": "Demonic", "whoCanCast": "Tiefling, Succubus, Incubus, Hellhound, Abyssal Hellhound, Devil, Fiend, Archdemon, Sphinx, Arch-Sphinx --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until dismissed.", "autoHit": "No", "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Demonic Bite", "sourceName": "Demonic Bite", "category": "Demonic", "whoCanCast": "Hellhound, Abyssal Hellhound, Tiefling, Sphinx, Arch-Sphinx --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until healed.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Demonic Flight", "sourceName": "Demonic Flight", "category": "Demonic", "whoCanCast": "Succubus, Incubus, Devil, Fiend, Archdemon, Sphinx, Arch-Sphinx --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Shapeshifting", "sourceName": "Shapeshifting", "category": "Demonic", "whoCanCast": "Tiefling, Succubus, Incubus, Devil, Fiend, Archdemon, Sphinx, Arch-Sphinx --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "N/A", "autoHit": "Yes", "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Weakness: Holy Light", "sourceName": "Weakness: Holy Light", "category": "Demonic", "whoCanCast": "All demonic beings: Succubus, Incubus, Hellhound, Abyssal Hellhound, Shadow Prowler (War Form only), Shadewalker (War Form Only) Devil, Fiend, Archdemon, Sphinx,, Arch-Sphinx (this is not an exhaustive list). --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The cleansing light of the Creator is anathema to the existence of demons and demonic beings. All demonic beings will take double damage from Holy Light spells ⁠unknown or Holy Vengeance weapons ⁠unknown \nDoes not count as spell", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Riddle of the Sphinx", "sourceName": "Riddle of the Sphinx", "category": "Sphinx", "whoCanCast": "Sphinx, Arch-Sphinx --------------------", "cost": "1 Mind", "duration": "Until the DC is passed.", "autoHit": "Yes", "friendlyFire": "N/A", "description": "The Sphinx points at their target and speaks a riddle, Cursing their intended target to puzzle over the riddle before they can take most other actions.\nThe Target rolls a DC:13 without modifiers to determine if they can come up with an answer to the riddle to avoid the effects of this Curse. The Target cannot Attack, Cast Spells, or use Abilities until they solve the riddle (pass the DC) on their Turn. The Target may still Defend and benefit from existing Passive Spells and Abilities.\nFor an Arch-Sphinx, the Spell DC is increased to 16 without modifiers.\nOnly one Target may be affected by this ability at any given time.\nTargets without a Spoken Language as well as Mindless Undead and Automatons are Immune (DM discretion.)\nThis Minor Curse breaks if the Target is Attacked by the Sphinx.", "sourceFile": "👿-demonic-abilities.txt"}]}, "Tiefling": {"name": "Tiefling", "family": "Demonic", "tier": "Base", "abilities": [{"name": "Demonic Claws", "sourceName": "Demonic Claws", "category": "Demonic", "whoCanCast": "Tiefling, Succubus, Incubus, Hellhound, Abyssal Hellhound, Devil, Fiend, Archdemon, Sphinx, Arch-Sphinx --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until dismissed.", "autoHit": "No", "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Demonic Bite", "sourceName": "Demonic Bite", "category": "Demonic", "whoCanCast": "Hellhound, Abyssal Hellhound, Tiefling, Sphinx, Arch-Sphinx --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until healed.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Imbue Weapon", "sourceName": "Imbue Weapon", "category": "Demonic", "whoCanCast": "Tiefling, Devil, Fiend, Archdemon, Abyssal Hellhound, Arch-Sphinx --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until combat ends.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Shapeshifting", "sourceName": "Shapeshifting", "category": "Demonic", "whoCanCast": "Tiefling, Succubus, Incubus, Devil, Fiend, Archdemon, Sphinx, Arch-Sphinx --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "N/A", "autoHit": "Yes", "friendlyFire": "N/A", "description": "", "sourceFile": "👿-demonic-abilities.txt"}]}, "Elder Draconic": {"name": "Elder Draconic", "family": "Draconic", "tier": "Advanced", "abilities": [{"name": "Draconic Breath", "sourceName": "Draconic Breath", "category": "Draconic", "whoCanCast": "Draconics --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Instant", "autoHit": "No", "friendlyFire": "Yes", "description": "Dragons can unleash their breath weapon in a cone 15ft wide and 30ft long. Anyone caught in the attack will take 2 Body and 2 Spirit, and must roll a DC: 13 or take an extra 1 Body and 1 Spirit from further damage.\nThe element of the breath must be chosen at the time of character creation and will determine features such as scale color. Elements include, but are not limited to: Fire, Cold, Lightning, Shadow, Holy Light, Poison. Element has no mechanical effect on the breath, unless targets have weaknesses/immunities.\nDragons can unleash their Breath Weapon every 3 rounds/minutes. \nCounts as spell", "sourceFile": "🐲-draconic-abilities.txt"}, {"name": "Draconic Flight", "sourceName": "Draconic Flight", "category": "Draconic", "whoCanCast": "Draconics --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Permanant", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Draconic Flight allows the dragon to take flight using their powerful wings. The Draconic can move 60ft in combat either vertically or horizontally and suffer no penalty for doing so as they are naturals at flying with many, many years of practice.\nDoes not count as spell", "sourceFile": "🐲-draconic-abilities.txt"}, {"name": "Draconic Claws", "sourceName": "Draconic Claws", "category": "Draconic", "whoCanCast": "Draconics --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until retracted", "autoHit": "No", "friendlyFire": "N/A", "description": "Draconic Claws are as hard as the strongest steel, and can be used to slice open their prey with ease. Those struck with a Dragon's Claws will take an initial 2 Body Damage, but must also roll a DC: 10 or lose 1 Body per round after that from bleeding out. The target must receive some form of healing to halt the bleeding.\nDoes not count as spell", "sourceFile": "🐲-draconic-abilities.txt"}, {"name": "Draconic Tail", "sourceName": "Draconic Tail", "category": "Draconic", "whoCanCast": "Draconics --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Permanant", "autoHit": "No", "friendlyFire": "N/A", "description": "Draconic Tails are quite powerful, and often used to deliver blunt force trauma to a foe, or to sweep them. Those hit by a Dragon's Tail will initially take 2 Body Damage, but must also roll a DC: 11 check. Failure to make the DC roll will have them knocked down and forced to spend their turn to recover.\nDoes not count as spell", "sourceFile": "🐲-draconic-abilities.txt"}, {"name": "Dragon Kin", "sourceName": "Dragon Kin", "category": "Draconic", "whoCanCast": "Elder Draconic --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Permanent", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Sharing Kinship with their larger brethren, an Elder Draconic is able to command tamed dragons more effectively than others. Draconics with this ability may add +2 to any roll involving Fallen Gate dragons, including but not limited to, determining species of the eggs, hatching rolls, training, exams and calling. As well as any DC rolls that any friendly/allied Dragons must make in combat where the Elder Draconic is present.\nMultiple Dragon-Kin do not stack their bonuses.\nDoes not count as spell.", "sourceFile": "🐲-draconic-abilities.txt"}, {"name": "Dragon Form", "sourceName": "Dragon Form", "category": "Draconic", "whoCanCast": "Elder Draconic --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until Draconic chooses to change back.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Elder Draconics can fully assume the form of their dragon ancestors. Assuming a dragon form takes 1 turn. The Draconic doubles their Body/Mind/Spirit stats and gain a natural AC 13. They may attack twice a turn, with Claws or Bites which deal 3/3/3 damage on a successful hit. Their Breath Weapon is upgraded to reach 100ft long and 20ft wide, dealing 5 Body, 5 Mind damage.\nGains a Fly speed of 150ft per turn.\nChanging counts as a spell. Once changed is no longer a spell.", "sourceFile": "🐲-draconic-abilities.txt"}]}, "Draconic": {"name": "Draconic", "family": "Draconic", "tier": "Base", "abilities": [{"name": "Draconic Breath", "sourceName": "Draconic Breath", "category": "Draconic", "whoCanCast": "Draconics --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Instant", "autoHit": "No", "friendlyFire": "Yes", "description": "Dragons can unleash their breath weapon in a cone 15ft wide and 30ft long. Anyone caught in the attack will take 2 Body and 2 Spirit, and must roll a DC: 13 or take an extra 1 Body and 1 Spirit from further damage.\nThe element of the breath must be chosen at the time of character creation and will determine features such as scale color. Elements include, but are not limited to: Fire, Cold, Lightning, Shadow, Holy Light, Poison. Element has no mechanical effect on the breath, unless targets have weaknesses/immunities.\nDragons can unleash their Breath Weapon every 3 rounds/minutes. \nCounts as spell", "sourceFile": "🐲-draconic-abilities.txt"}, {"name": "Draconic Flight", "sourceName": "Draconic Flight", "category": "Draconic", "whoCanCast": "Draconics --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Permanant", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Draconic Flight allows the dragon to take flight using their powerful wings. The Draconic can move 60ft in combat either vertically or horizontally and suffer no penalty for doing so as they are naturals at flying with many, many years of practice.\nDoes not count as spell", "sourceFile": "🐲-draconic-abilities.txt"}, {"name": "Draconic Claws", "sourceName": "Draconic Claws", "category": "Draconic", "whoCanCast": "Draconics --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until retracted", "autoHit": "No", "friendlyFire": "N/A", "description": "Draconic Claws are as hard as the strongest steel, and can be used to slice open their prey with ease. Those struck with a Dragon's Claws will take an initial 2 Body Damage, but must also roll a DC: 10 or lose 1 Body per round after that from bleeding out. The target must receive some form of healing to halt the bleeding.\nDoes not count as spell", "sourceFile": "🐲-draconic-abilities.txt"}, {"name": "Draconic Tail", "sourceName": "Draconic Tail", "category": "Draconic", "whoCanCast": "Draconics --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Permanant", "autoHit": "No", "friendlyFire": "N/A", "description": "Draconic Tails are quite powerful, and often used to deliver blunt force trauma to a foe, or to sweep them. Those hit by a Dragon's Tail will initially take 2 Body Damage, but must also roll a DC: 11 check. Failure to make the DC roll will have them knocked down and forced to spend their turn to recover.\nDoes not count as spell", "sourceFile": "🐲-draconic-abilities.txt"}]}, "Dread Lich": {"name": "Dread Lich", "family": "Lich", "tier": "Advanced", "abilities": [{"name": "Drain Life", "sourceName": "Drain Life", "category": "Lich", "whoCanCast": "Lich, Dread Lich --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Permanent unless suppressed", "autoHit": "No", "friendlyFire": "N/A", "description": "The touch of a Lich is anathema to all living beings. If a Lich touches or is touched by a living creature, they will cause 2 Body damage, DC10 or take a further 1 Spirit damage (Counts as magical attack). Undead touched are healed by 2 Body. This ability may be consciously suppressed by the Lich.\nCounts as spell", "sourceFile": "Lich Abilities.txt"}, {"name": "Phylactery", "sourceName": "Create Phylactery", "category": "Lich", "whoCanCast": "Lich, Dread Lich --------------------------------------------------------------------------------------------------------------------", "cost": "Varies", "duration": "Permanent", "autoHit": "N/A", "friendlyFire": "N/A", "description": "All Liches have their souls safely contained within their Phylactery, while it exists the Lich cannot be destroyed. If destroyed, a Phylactery can be created by a Grand Master Jeweller, and enchanted by the Lich in a ritual that takes 10 hours to complete.\nAt the moment of their death, their remains will dissolve and begin reforming within 5 feet of the Phylactery. While in this state, their body shall slowly rebuild itself over a 48 Hour period. Once they are fully revived, they will be mentally and spiritually drained from the horrific ordeal (Stats 1/1/1), and need sufficient time to recover (heal at normal rate for Rank).\nIf the Phylactery is destroyed, the Lich is at risk of final destruction by normal means, until they can craft a new Phylactery", "sourceFile": "Lich Abilities.txt"}, {"name": "Create Soulstones", "sourceName": "Create Soulstones", "category": "Lich", "whoCanCast": "Dread Lich --------------------------------------------------------------------------------------------------------------------", "cost": "Varies", "duration": "Permanent / Until destroyed", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Seeking out ancient and forgotten knowledge the Lich learns how to craft Soul Stones, by implanting their skull with eight Soul Stones the Lich grows beyond the need of a body. Their skull becomes animated independently, and is capable of inhabiting another dead body of it's choosing. This form is known as a Dread Lich. \nA Dread Lich with eight enchanted Soul Stones do not die when their body is reduced to 0, instead their body crumbles and their Skull remains. The skull levitates at 20 ft per round and may cast any spells the Dread Lich knows which can be cast without a body.\nThe skull may attempt to inhabit a dead body to reform itself at full Body. Undead creatures may make a DC 10 check to resist being taken by the Dread Lich. \nIn skull form the Skull is immune to damage, the Soul Stones must be independently targeted and destroyed (AC 16, 4 Body each) to destroy the skull. The Lich then retreats back to it's Phylactery normally. Any successful hit by a Holy Light or Holy Fire spell will immediately destroy all remaining Soul Stones and send the Lich to it's Phylactery. Destroyed Soul Stones must be recrafted by the Lich for them to retake the mantle of a Dread Lich.", "sourceFile": "Lich Abilities.txt"}]}, "Lich": {"name": "Lich", "family": "Lich", "tier": "Base", "abilities": [{"name": "Drain Life", "sourceName": "Drain Life", "category": "Lich", "whoCanCast": "Lich, Dread Lich --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Permanent unless suppressed", "autoHit": "No", "friendlyFire": "N/A", "description": "The touch of a Lich is anathema to all living beings. If a Lich touches or is touched by a living creature, they will cause 2 Body damage, DC10 or take a further 1 Spirit damage (Counts as magical attack). Undead touched are healed by 2 Body. This ability may be consciously suppressed by the Lich.\nCounts as spell", "sourceFile": "Lich Abilities.txt"}, {"name": "Phylactery", "sourceName": "Create Phylactery", "category": "Lich", "whoCanCast": "Lich, Dread Lich --------------------------------------------------------------------------------------------------------------------", "cost": "Varies", "duration": "Permanent", "autoHit": "N/A", "friendlyFire": "N/A", "description": "All Liches have their souls safely contained within their Phylactery, while it exists the Lich cannot be destroyed. If destroyed, a Phylactery can be created by a Grand Master Jeweller, and enchanted by the Lich in a ritual that takes 10 hours to complete.\nAt the moment of their death, their remains will dissolve and begin reforming within 5 feet of the Phylactery. While in this state, their body shall slowly rebuild itself over a 48 Hour period. Once they are fully revived, they will be mentally and spiritually drained from the horrific ordeal (Stats 1/1/1), and need sufficient time to recover (heal at normal rate for Rank).\nIf the Phylactery is destroyed, the Lich is at risk of final destruction by normal means, until they can craft a new Phylactery", "sourceFile": "Lich Abilities.txt"}]}, "Lycan Pack Leader": {"name": "Lycan Pack Leader", "family": "Lycan", "tier": "Advanced", "abilities": [{"name": "Lycan War Form", "sourceName": "Lycan War Form", "category": "Lycan", "whoCanCast": "All Lycans -------------------------------------", "cost": "Free", "duration": "As long as the Lycan wishes.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "A Lycans Two-legged war form is a horrific sight to behold as they become a monstrous thing stuck somewhere between man and wolf towering over others at a height of eight to nine feet tall.\nThe Lycan War Form can attack twice in one round, either with two claw attacks, or a claw and a bite. Their Body, Mind, and Spirit is doubled and their armor becomes AC:13 for the duration. The War Form’s movement is 60 feet per Round/Minute. This form will last for as long as the Lycan wishes.\nLycan War Form gains the following Lycan Abilites:\nLycan War Form Claws, Lycan War Form Bite, Weakness: Silver\nThis ability takes one (1) full Round/Minute to fully transform IN COMBAT.\nBecause of the strain of a fast shapeshift in combat situations on the body, you can only shapeshift ONCE in combat, either into or out of War Form.\nNormal out-of-combat shapeshifting should take about five minutes of normal roleplay.\n(This is to allow for players to change tactics in combat between being a spell caster or heavy melee without allowing the player to change at their whimsy every other Round.)\nAll buffs and armor pre-cast before taking on this form are suspended until the effect ends, and then they are restored. Buffs from Jewelry and Potions always remain active.\nA Lycan cannot cast spells while in this form.\nThis counts as a Spell during the transformation process and may be countered.", "sourceFile": "Lycan Abilites.txt"}, {"name": "Lycan War Form Claws", "sourceName": "Lycan War Form Claws", "category": "Lycan", "whoCanCast": "All Lycans --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Duration of War Form", "autoHit": "No", "friendlyFire": "N/A", "description": "Lycan Claws can be used to slice open their prey with ease. Those struck with a Lycan's Claws will take an initial 3 Body, 3 Spirit Damage, but must also roll a DC: 11 or lose 1 Body per round after that from bleeding out. Target must receive some form of healing to halt the bleeding.\nBeing clawed by a Lycan has the potential to cause Lycanthropy in mortals. DC: 14 to resist the effects.", "sourceFile": "Lycan Abilites.txt"}, {"name": "Lycan War Form Bite", "sourceName": "Lycan War Form Bite", "category": "Lycan", "whoCanCast": "All Lycans --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Duration of War Form", "autoHit": "No", "friendlyFire": "N/A", "description": "A Lycan's War Form Bite is quite savage indeed. Anyone suffering a bite from those powerful jaws will take 3 Body and 3 Spirit, but must also make a DC: 11 or lose an extra 1 Body from the severe damage caused.\nBeing bitten by a Lycan has the potential to cause Lycanthropy in mortals. DC: 14 to resist the effects.", "sourceFile": "Lycan Abilites.txt"}, {"name": "Form Mastery", "sourceName": "Form Mastery", "category": "Lycan, Demonic", "whoCanCast": "Lycan Pack Leader, Shadewalker ----------------------- ----------", "cost": "Free", "duration": "As long as the user wishes.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The character is able to manipulate their bodies to take on aspects of their War Form without fully transforming. They may use War Form attacks (Claw and Bite) and movement (60 feet per Round), without undergoing a full transformation. This partial transformation is instant and the character is allowed to move and make an immediate attack in addition to using this ability. \nThis does not count as spell.\nThis does NOT bestow the AC 8 or the doubling of stats from Lycan War Form.\nThis does NOT bestow Nine Lives or the +2 bonus to Attack and Defense from Shadow Prowler War From.", "sourceFile": "👿-demonic-abilities.txt"}, {"name": "Pack Tactics", "sourceName": "Pack Tactics", "category": "Lycan", "whoCanCast": "Lycan Pack Leader --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "End of Combat", "autoHit": "No", "friendlyFire": "N/A", "description": "A Pack of Lycans led by a Leader is a terrible threat to even the most powerful foe. Able to coordinate their attacks on an instinctive level, working together to bring down foes many times their own size. A Pack lead by a Pack Leader will gain +1 Combat Modifier for every Pack Member present after the first member, (example: a pack of 3 will gain +2 Combat Modifier) \nDoes not count as spell", "sourceFile": "Lycan Abilites.txt"}, {"name": "Apex Predator", "sourceName": "Apex Predator", "category": "Lycan, Demonic", "whoCanCast": "Lycan Pack Leader, Shadewalker --------------------------------------------------------------", "cost": "None", "duration": "Permanent", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The claws and teeth of an apex predator are more deadly than most.\nThis character’s War Form also gains a +2 bonus to Attack and Defense.", "sourceFile": "Lycan Abilites.txt"}, {"name": "Primal Roar", "sourceName": "Primal Roar", "category": "Lycan, Demonic", "whoCanCast": "Lycan Pack Leader, Shadewalker", "cost": "None", "duration": "Instant", "autoHit": "Yes", "friendlyFire": "N/A", "description": "The roar of an apex predator echoes through the battlefield inducing fear in their enemies. All enemies who can hear the roar must roll a DC: 10 or suffer 3 Spirit Damage. Further more enemies that take half or more of their base Spirit in Damage from this ability will be frozen in fear and lose their next Round.\nThis may only be used ONCE PER COMBAT per character in War Form.", "sourceFile": "Lycan Abilites.txt"}, {"name": "Weakness: Silver", "sourceName": "Weakness: Silver", "category": "Lycan", "whoCanCast": "All Lycans --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The purifyin aspects of Silver is anathema to the disease which causes the Lycan condition, inflicting extra damage to Lycans in their War Form or in their Wolf Form.. All lycan beings will take double damage from Silver Weapons ⁠unknown or spells which utilise silver.\nDoes not count as spell", "sourceFile": "Lycan Abilites.txt"}]}, "Lycan": {"name": "Lycan", "family": "Lycan", "tier": "Base", "abilities": [{"name": "Lycan War Form", "sourceName": "Lycan War Form", "category": "Lycan", "whoCanCast": "All Lycans -------------------------------------", "cost": "Free", "duration": "As long as the Lycan wishes.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "A Lycans Two-legged war form is a horrific sight to behold as they become a monstrous thing stuck somewhere between man and wolf towering over others at a height of eight to nine feet tall.\nThe Lycan War Form can attack twice in one round, either with two claw attacks, or a claw and a bite. Their Body, Mind, and Spirit is doubled and their armor becomes AC:13 for the duration. The War Form’s movement is 60 feet per Round/Minute. This form will last for as long as the Lycan wishes.\nLycan War Form gains the following Lycan Abilites:\nLycan War Form Claws, Lycan War Form Bite, Weakness: Silver\nThis ability takes one (1) full Round/Minute to fully transform IN COMBAT.\nBecause of the strain of a fast shapeshift in combat situations on the body, you can only shapeshift ONCE in combat, either into or out of War Form.\nNormal out-of-combat shapeshifting should take about five minutes of normal roleplay.\n(This is to allow for players to change tactics in combat between being a spell caster or heavy melee without allowing the player to change at their whimsy every other Round.)\nAll buffs and armor pre-cast before taking on this form are suspended until the effect ends, and then they are restored. Buffs from Jewelry and Potions always remain active.\nA Lycan cannot cast spells while in this form.\nThis counts as a Spell during the transformation process and may be countered.", "sourceFile": "Lycan Abilites.txt"}, {"name": "Lycan War Form Claws", "sourceName": "Lycan War Form Claws", "category": "Lycan", "whoCanCast": "All Lycans --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Duration of War Form", "autoHit": "No", "friendlyFire": "N/A", "description": "Lycan Claws can be used to slice open their prey with ease. Those struck with a Lycan's Claws will take an initial 3 Body, 3 Spirit Damage, but must also roll a DC: 11 or lose 1 Body per round after that from bleeding out. Target must receive some form of healing to halt the bleeding.\nBeing clawed by a Lycan has the potential to cause Lycanthropy in mortals. DC: 14 to resist the effects.", "sourceFile": "Lycan Abilites.txt"}, {"name": "Lycan War Form Bite", "sourceName": "Lycan War Form Bite", "category": "Lycan", "whoCanCast": "All Lycans --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Duration of War Form", "autoHit": "No", "friendlyFire": "N/A", "description": "A Lycan's War Form Bite is quite savage indeed. Anyone suffering a bite from those powerful jaws will take 3 Body and 3 Spirit, but must also make a DC: 11 or lose an extra 1 Body from the severe damage caused.\nBeing bitten by a Lycan has the potential to cause Lycanthropy in mortals. DC: 14 to resist the effects.", "sourceFile": "Lycan Abilites.txt"}, {"name": "Weakness: Silver", "sourceName": "Weakness: Silver", "category": "Lycan", "whoCanCast": "All Lycans --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The purifyin aspects of Silver is anathema to the disease which causes the Lycan condition, inflicting extra damage to Lycans in their War Form or in their Wolf Form.. All lycan beings will take double damage from Silver Weapons ⁠unknown or spells which utilise silver.\nDoes not count as spell", "sourceFile": "Lycan Abilites.txt"}]}, "Master Vampire": {"name": "Master Vampire", "family": "Vampire", "tier": "Advanced", "abilities": [{"name": "Vampire Claws", "sourceName": "Vampire Claws", "category": "Vampire", "whoCanCast": "Vampire, Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until healed.", "autoHit": "No", "friendlyFire": "N/A", "description": "Vampire Claws can be used to slice open their prey with ease. Those struck with a vampire's claws will take an initial 2 Body Damage, but must also roll a DC: 10 or lose 1 Body per round after that from bleeding out. Target must receive some form of healing to halt the bleeding.\nDoes not count as a spell.", "sourceFile": "Vampire Abilities.txt"}, {"name": "Vampire Bite", "sourceName": "Vampire Bite", "category": "Vampire", "whoCanCast": "Vampire, Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until depleted or escaped.", "autoHit": "No", "friendlyFire": "N/A", "description": "A Vampire's Bite is one of their most powerful tools. Not only is it used for feeding, but after the initial pain, the pleasure brought about by the embrace can paralyze a foe. Anyone bitten by a Vampire will take an initial 2 Body Damage, but must also roll a DC: 13 or be unable to act or do anything other then be fed upon. Those bitten will take an extra 2 Body Damage per round till their Body is depleted or they escape. Those depleted are either killed or turned into Vampires themselves. Vampires will heal 1 Body Damage per round that they feed on their victim. The victim may make a DC13 check each round to escape.\nDoes not count as a spell.", "sourceFile": "Vampire Abilities.txt"}, {"name": "Wolf Form", "sourceName": "Wolf Form", "category": "Vampire", "whoCanCast": "Vampire, Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until Vampire chooses to turn back.", "autoHit": "No", "friendlyFire": "N/A", "description": "Vampires are known for being able to take the shape of a large dire wolf. While in this form, Vampires can move 60ft per round/minute. Also, if they choose to bite, their attack will do 2 Body Damage to their prey. Those bitten must roll a DC: 10 or suffer a debilitating infection causing weakness throughout their body. Those afflicted will have a -1 to attack/dodge till cured.\nChanging counts as a spell. Once in wolf form is no longer a spell", "sourceFile": "Vampire Abilities.txt"}, {"name": "Swarm of Bats", "sourceName": "Swarm of Bats", "category": "Vampire", "whoCanCast": "Vampire, Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until Vampire choooses to turn back", "autoHit": "N/A", "friendlyFire": "N/A", "description": "", "sourceFile": "Vampire Abilities.txt"}, {"name": "Gaseous Form", "sourceName": "Gaseous Form", "category": "Vampire", "whoCanCast": "Vampire, Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until dispelled/Vampire chooses to reform.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "", "sourceFile": "Vampire Abilities.txt"}, {"name": "Command Vampire", "sourceName": "Command Vampire", "category": "Vampire", "whoCanCast": "Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "24 hours per DC check", "autoHit": "Yes", "friendlyFire": "N/A", "description": "A Master Vampire is able to telepathically dominate lesser Vampires around them. Target make DC 14 check to resist or follow the Master's command for 24 hours. Once control has been established it is harder to break free of the will of the Master, subsequent DC check to break control is DC 17 made once every 24 hours.\nThis Ability does not work on other Master Vampires\nCounts as a spell", "sourceFile": "Vampire Abilities.txt"}, {"name": "True Form", "sourceName": "True Form", "category": "Vampire", "whoCanCast": "Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "End of scene", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The Master Vampire has learned to unleash their True Vampiric nature into their physical form, twisting their physique to match their damned soul. The Master turns into the form of a 10-foot bat winged beast with two massive claws, and a jaw with two long feeding teeth.\nWhile under the effects of this form, you gain a Fly speed of 60ft/round, you get 2 physicals attacks (which can be claws or bite attacks) that do 3 Body / 3 Spirit a piece (in addition to secondary effects of Vampire Claws and Vampire Bite) and an Armor Class of 10 and your Body/Mind/Spirit are doubled. You cannot however use any magic spells until you change back. Any damage taken while in this form will be healed once you transform back.\nChanging form counts as a spell. Once in form it is no longer a spell", "sourceFile": "Vampire Abilities.txt"}, {"name": "Power of Blood", "sourceName": "Power of Blood", "category": "Vampire", "whoCanCast": "Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Permanent", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The Master Vampire has tapped into the True Power of their Blood, able to power their spells utilizing the Blood of their own bodies, or even those of their minions. The Master Vampire is considered to be constantly under the effects of the spell Illimitata Infinita (Unlimited Power) ⁠unknown , being able to at will power any spell or skill cost with Body points. Furthermore, any creature or entity under the influence of the Master Vampire's \"Command Vampire\" or Charm, Command or Suggestion Psionic ability can be used to pay these Body Cost instead of the Master.\nDoes not count as a spell.", "sourceFile": "Vampire Abilities.txt"}, {"name": "Undying", "sourceName": "Undying", "category": "Vampire", "whoCanCast": "Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "7 Days", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The usual methods of slaying a vampire are mere inconveniences and setbacks for a Master Vampire. Able to return from the final death after staking, decapitation, holy water, sunlight and more. Upon Final Death a Master Vampire's body disintegrates into dust which is blown away by an unholy wind. The Dust gathers in it's coffin and rebuilds the body over the course of 7 days. This regeneration can be made immediate if 10 Body points of blood can be applied direct to the Dust. \nEach Master Vampire's method of destruction is unique, complex, and always dangerous. The Master Vampire will keep this method a guarded secret.\nDoes not count as a spell.", "sourceFile": "Vampire Abilities.txt"}, {"name": "Day Walker", "sourceName": "Day Walker", "category": "Vampire", "whoCanCast": "Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "A Master Vampire has the ability to resist the burning rays of the Sun on Prime Material Earth and those planes with similar solar centres. Such exposure will still make them feel uncomfortable, such as when any nocturnal creature is active during the day, however, such exposure will not harm or kill a Master Vampire (negating the need to make the DC 10 check as detailed in Weakness: Sunlight). Directed solar attacks such as with Magics or some similar ability/technology will still cause damage to the Master Vampire as usual within the rules of the spell/ability.\nDoes not count as a spell.", "sourceFile": "Vampire Abilities.txt"}, {"name": "Weakness: Fire/ Holy Fire", "sourceName": "Weakness: Fire/ Holy Fire", "category": "Vampire", "whoCanCast": "Vampire, Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The purifying flames are anathema to the cursed existence of the undead. All Vampires and Undead take double Body Damage from Fire-Based and Holy-Fire Based attacks and spell. Damage from Hell Fire is not doubled as it's infernal nature is not purifying.\nDoes not count as a spell.", "sourceFile": "Vampire Abilities.txt"}]}, "Vampire": {"name": "Vampire", "family": "Vampire", "tier": "Base", "abilities": [{"name": "Vampire Claws", "sourceName": "Vampire Claws", "category": "Vampire", "whoCanCast": "Vampire, Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until healed.", "autoHit": "No", "friendlyFire": "N/A", "description": "Vampire Claws can be used to slice open their prey with ease. Those struck with a vampire's claws will take an initial 2 Body Damage, but must also roll a DC: 10 or lose 1 Body per round after that from bleeding out. Target must receive some form of healing to halt the bleeding.\nDoes not count as a spell.", "sourceFile": "Vampire Abilities.txt"}, {"name": "Vampire Bite", "sourceName": "Vampire Bite", "category": "Vampire", "whoCanCast": "Vampire, Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until depleted or escaped.", "autoHit": "No", "friendlyFire": "N/A", "description": "A Vampire's Bite is one of their most powerful tools. Not only is it used for feeding, but after the initial pain, the pleasure brought about by the embrace can paralyze a foe. Anyone bitten by a Vampire will take an initial 2 Body Damage, but must also roll a DC: 13 or be unable to act or do anything other then be fed upon. Those bitten will take an extra 2 Body Damage per round till their Body is depleted or they escape. Those depleted are either killed or turned into Vampires themselves. Vampires will heal 1 Body Damage per round that they feed on their victim. The victim may make a DC13 check each round to escape.\nDoes not count as a spell.", "sourceFile": "Vampire Abilities.txt"}, {"name": "Wolf Form", "sourceName": "Wolf Form", "category": "Vampire", "whoCanCast": "Vampire, Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until Vampire chooses to turn back.", "autoHit": "No", "friendlyFire": "N/A", "description": "Vampires are known for being able to take the shape of a large dire wolf. While in this form, Vampires can move 60ft per round/minute. Also, if they choose to bite, their attack will do 2 Body Damage to their prey. Those bitten must roll a DC: 10 or suffer a debilitating infection causing weakness throughout their body. Those afflicted will have a -1 to attack/dodge till cured.\nChanging counts as a spell. Once in wolf form is no longer a spell", "sourceFile": "Vampire Abilities.txt"}, {"name": "Swarm of Bats", "sourceName": "Swarm of Bats", "category": "Vampire", "whoCanCast": "Vampire, Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until Vampire choooses to turn back", "autoHit": "N/A", "friendlyFire": "N/A", "description": "", "sourceFile": "Vampire Abilities.txt"}, {"name": "Gaseous Form", "sourceName": "Gaseous Form", "category": "Vampire", "whoCanCast": "Vampire, Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until dispelled/Vampire chooses to reform.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "", "sourceFile": "Vampire Abilities.txt"}, {"name": "Weakness: Fire/ Holy Fire", "sourceName": "Weakness: Fire/ Holy Fire", "category": "Vampire", "whoCanCast": "Vampire, Master Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The purifying flames are anathema to the cursed existence of the undead. All Vampires and Undead take double Body Damage from Fire-Based and Holy-Fire Based attacks and spell. Damage from Hell Fire is not doubled as it's infernal nature is not purifying.\nDoes not count as a spell.", "sourceFile": "Vampire Abilities.txt"}, {"name": "Weakness: Sunlight", "sourceName": "Weakness: Sunlight", "category": "Vampire", "whoCanCast": "Vampire --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The light from the Sun of Prime Material Earth is harmful to the body and soul of a Vampire. Every round that a Vampire with this weakness is in direct sunlight or a similar spell/ability that specifically recreates the rays of the Sun will cause the Vampire to have to pass a DC10 check or take 1 Body, 1 Mind and 1 Spirit Damage.\nThe solar centres of other Planes of existence do not necessarily trigger this Weakness unless the rules specifically state so (DM's decision).\nDoes not count as a spell.", "sourceFile": "Vampire Abilities.txt"}]}, "Queen Slime": {"name": "Queen Slime", "family": "Slime", "tier": "Advanced", "abilities": [{"name": "Pseudopod", "sourceName": "Pseudopod", "category": "Slimes", "whoCanCast": "Slime, Queen Slime --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Instant", "autoHit": "No", "friendlyFire": "N/A", "description": "The Slime can produce a Pseudopod arm to attack those up to 10 feet away. The arm does 2 Body Damage from the acid. Those hit by the arm must make a DC: 11 roll or take an extra 1 body dmg per round from the acid burn until they can pass another DC 11 roll.\nDoes not count as spell.", "sourceFile": "Slime Abilities.txt"}, {"name": "Engulf", "sourceName": "Engulf", "category": "Slimes", "whoCanCast": "Slime, Queen Slime --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until victim is dead or escapes", "autoHit": "No", "friendlyFire": "N/A", "description": "If the Slime moves close to a foe, it can attempt to Engulf them. If pulled inside the cube, the victim takes 2 Body Damage per round till pulled free, those engulfed are unable to save themselves by normal means. DC: 13 to pull them to safety. Those attempting to free the victim takes 2 Body Damage from the acid. All melee attacks to the Ab
