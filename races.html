yssal Cube will damage the attacker by 2 Body Damage per strike. A Slime can only have one foe engulfed at a time. If a foe is reduced to 0 Body they are fully digested and restores the Slime 2 Body.\nDoes not count as spell.", "sourceFile": "Slime Abilities.txt"}, {"name": "Shapeshifting", "sourceName": "Shapeshifting", "category": "Slimes", "whoCanCast": "Slime, Queen Slime --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until the Slime chooses to change form again", "autoHit": "Yes", "friendlyFire": "N/A", "description": "Shapeshifting allows the slime the ability to take the forms of humanoids, this can be used to confuse an enemy in battle. After focusing on a foe and performing this ability, the enemy must make a DC: 13 or be stunned by seeing the transformation causing them to hesitate during battle and losing an entire round. The one affected must roll a DC: 13 to snap out of their bewilderment in order to continue fighting. If the target is damaged, they will break out of their stunned state and starting fighting again.\nDoes not count as spell.", "sourceFile": "Slime Abilities.txt"}, {"name": "Bifurcate", "sourceName": "Bifurcate", "category": "Slime", "whoCanCast": "Queen Slime --------------------------------------------------------------------------------------------------------------------", "cost": "Variable number of Body Points", "duration": "Permanent/ Until the Slime is killed", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The Queen Slimes are able to bud off smaller Slimes who are subservient to her, at the cost of her own Slime Slime Queens may spend Body Points to create a small Abyssal Cube ⁠monster-guide⁠ with Body/Mind/Spirit Stats equal to the number of Body/Mind/Spirit Points spent by the Queen to create the Slime. The Slime is completely loyal and subservient to the Queen that spawned her, but is able to act on their own intelligence and self motivation.\nDoes not count as spell.", "sourceFile": "Slime Abilities.txt"}, {"name": "Fuse", "sourceName": "Fuse", "category": "Slime", "whoCanCast": "Queen Slime --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "End of Combat", "autoHit": "No", "friendlyFire": "Special case", "description": "Queen Slimes can fuse with lesser Slimes to become stronger. Any Slime which is successfully Engulfed ⁠unknown by a Queen Slime are immediately consumed and add their current Body/Mind/Spirit points to the Slime Queens current total. Any excess points beyond the Queen's normal maximum are lost at the end of the Combat/Scene/Day. The Slime Queen may choose use her Bifurcate ability to release slimes that had willingly Fused with her.\nDoes not count as spell.", "sourceFile": "Slime Abilities.txt"}, {"name": "Healing Slime", "sourceName": "Healing Slime", "category": "Slime", "whoCanCast": "Queen Slime --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until the target is expelled or pulled free.", "autoHit": "Special", "friendlyFire": "Special", "description": "A Queen Slime is able to use her Slime to heal those within her as well as to consume them. An Engulfed target may be held in a suspended animation while the Queen passively Heals them for 2 Body per round (on the Slime Queen's turn), those attempting to pull the Engulfed target out of the Slime Queen do not take any acid damage from their attempts. \nDoes not count as spell.", "sourceFile": "Slime Abilities.txt"}]}, "Slime": {"name": "Slime", "family": "Slime", "tier": "Base", "abilities": [{"name": "Pseudopod", "sourceName": "Pseudopod", "category": "Slimes", "whoCanCast": "Slime, Queen Slime --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Instant", "autoHit": "No", "friendlyFire": "N/A", "description": "The Slime can produce a Pseudopod arm to attack those up to 10 feet away. The arm does 2 Body Damage from the acid. Those hit by the arm must make a DC: 11 roll or take an extra 1 body dmg per round from the acid burn until they can pass another DC 11 roll.\nDoes not count as spell.", "sourceFile": "Slime Abilities.txt"}, {"name": "Engulf", "sourceName": "Engulf", "category": "Slimes", "whoCanCast": "Slime, Queen Slime --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until victim is dead or escapes", "autoHit": "No", "friendlyFire": "N/A", "description": "If the Slime moves close to a foe, it can attempt to Engulf them. If pulled inside the cube, the victim takes 2 Body Damage per round till pulled free, those engulfed are unable to save themselves by normal means. DC: 13 to pull them to safety. Those attempting to free the victim takes 2 Body Damage from the acid. All melee attacks to the Abyssal Cube will damage the attacker by 2 Body Damage per strike. A Slime can only have one foe engulfed at a time. If a foe is reduced to 0 Body they are fully digested and restores the Slime 2 Body.\nDoes not count as spell.", "sourceFile": "Slime Abilities.txt"}, {"name": "Shapeshifting", "sourceName": "Shapeshifting", "category": "Slimes", "whoCanCast": "Slime, Queen Slime --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until the Slime chooses to change form again", "autoHit": "Yes", "friendlyFire": "N/A", "description": "Shapeshifting allows the slime the ability to take the forms of humanoids, this can be used to confuse an enemy in battle. After focusing on a foe and performing this ability, the enemy must make a DC: 13 or be stunned by seeing the transformation causing them to hesitate during battle and losing an entire round. The one affected must roll a DC: 13 to snap out of their bewilderment in order to continue fighting. If the target is damaged, they will break out of their stunned state and starting fighting again.\nDoes not count as spell.", "sourceFile": "Slime Abilities.txt"}]}, "Frost Jotun Jarl": {"name": "Frost Jotun Jarl", "family": "Jotun", "tier": "Advanced", "abilities": [{"name": "Frost Giant Form", "sourceName": "Frost Giant Form (Monstrous Form)", "category": "Giant", "whoCanCast": "Giant ------------------------------------------------------------------------------------------------------", "cost": "None", "duration": "Instant", "autoHit": "N/A", "friendlyFire": "N/A", "description": "This ability allows the Jotun to turn themselves into a hulking juggernaut of death and destruction. They take the form of a 15-foot tall giant with massive fists the size of boulders, a mouth full of long pointy teeth, and thick skin.\nTo take this form, it requires the Caster to concentrate for 1 round. The Caster can then take action in their new form at the beginning of the following round.\nWhile in Giant Form, you get 2 physicals attacks that do 3 Body / 3 Spirit a piece and an Armor Class of 13 and your Body/Mind/Spirit are doubled. You cannot however use any magic other than to transform back which takes another round to complete. Any damage taken while in this form will be healed once you transform back.\nAll buffs pre-cast before taking on this form are suspended until the effect ends, then they are restored.\nJewelry buffs are still active when in Giant Form", "sourceFile": "Jotun Abilites.txt"}, {"name": "Frost Giant Fists", "sourceName": "Frost Giant Fist", "category": "Giant", "whoCanCast": "Frost giant --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until dismissed.", "autoHit": "No", "friendlyFire": "N/A", "description": "The fist of a frost giant are as hard as the strongest steel, and can be used to break bones with ease. Those struck with a fist from a frost giant will take an initial 2 Body Damage, the cold from the fist of a frost giant will cover the target causing them to freeze Target must roll a DC: 10 or be frozen in place for 1 turn.\nDoes double damage to slimes\nDoes not count as a spell.", "sourceFile": "Jotun Abilites.txt"}, {"name": "Frost Giant Breath", "sourceName": "Frost Giants Breath", "category": "Frost Giant", "whoCanCast": "Frost Giant ------------------------------------------------------------------------------------", "cost": "Free", "duration": "Instant", "autoHit": "No", "friendlyFire": "Yes", "description": "Frost Giants can unleash their breath weapon in a cone 15ft wide and 30ft long. Anyone caught in the attack will take 2 Body and 2 Spirit, and must roll a DC: 13 or begin to freeze giving them a -2 to attacks and dodges.\nFrost giants can unleash their Breath Weapon every 3 rounds/minutes. \nThe Jotun may use this ability in their Giant Form\nCounts as spell", "sourceFile": "Jotun Abilites.txt"}, {"name": "Weakness Fire", "sourceName": "Weakness: Fire/ Holy Fire / Hellfire", "category": "Giant", "whoCanCast": "Frost Giant and Forst Giant Jarl --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The heat of flames are particularly harmful to Frost Giants. All Forst Giants and Frost Giant Jarls take double Body Damage from Fire-Based, Holy-Fire Based and Hell Fire based attacks and spells. \nWearing Fire Jewelery will negate this Weakness\nDoes not count as a spell.", "sourceFile": "Jotun Abilites.txt"}, {"name": "Giant's Roar", "sourceName": "Giants Roar", "category": "Giant", "whoCanCast": "Giants Jarls ------------------------------------------------------------------------------------------------------", "cost": "None", "duration": "Instant", "autoHit": "Yes", "friendlyFire": "N/A", "description": "The roar of giant Jarls echo through the battlefield inducing fear in their enemies. All enemies who can hear the roar must roll a DC: 10 or suffer 3 Spirit Damage. Further more enemies that take half or more of their base Spirit in Damage from this ability will be frozen in fear and lose their next Round.\nThis may only be used ONCE PER COMBAT per character.\nA Jarl may use this ability in their Giant Form", "sourceFile": "Jotun Abilites.txt"}, {"name": "Jarl War Form", "sourceName": "Jarl War Form", "category": "Giant", "whoCanCast": "Jarl Giants ------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "A Jarl of the Giant races are more ferocious than their lesser kin.\nA Jarl may assume a War Form instantly, allowing them to change form and attack in the same action.\nThe Jarl's War Form has an extra attack of 3/0/3 Damage.", "sourceFile": "Jotun Abilites.txt"}, {"name": "Imbue Weapon (Ice)", "sourceName": "Imbue Weapon", "category": "Angelic", "whoCanCast": "Fallen Angels, Fallen Arch-Angels -----------------------------------------------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until dismissed", "autoHit": "No", "friendlyFire": "N/A", "description": "Fallen Angels have the ability to imbue any non-summoned weapon (Bone Weapons and Blood Whips are summoned weapons) with their power. Upon doing so, the weapon begins to glow with a purple Shadowfyre hue allowing it to do an extra 1 Body/1 Mind/1 Spirit in Shadow Damage to any foe it hits. This ability can also turn any normal weapon into a magical object. This power can also be used on magical weapons to make them stronger. This effect fades after the combat has ended.\nOnly works on the Angel's own weapon. The moment they relinquish their weapon the Shadowfyre ends with immediate effect.", "sourceFile": "Angelic Abilities.txt"}]}, "Frost Jotun": {"name": "Frost Jotun", "family": "Jotun", "tier": "Base", "abilities": [{"name": "Frost Giant Form", "sourceName": "Frost Giant Form (Monstrous Form)", "category": "Giant", "whoCanCast": "Giant ------------------------------------------------------------------------------------------------------", "cost": "None", "duration": "Instant", "autoHit": "N/A", "friendlyFire": "N/A", "description": "This ability allows the Jotun to turn themselves into a hulking juggernaut of death and destruction. They take the form of a 15-foot tall giant with massive fists the size of boulders, a mouth full of long pointy teeth, and thick skin.\nTo take this form, it requires the Caster to concentrate for 1 round. The Caster can then take action in their new form at the beginning of the following round.\nWhile in Giant Form, you get 2 physicals attacks that do 3 Body / 3 Spirit a piece and an Armor Class of 13 and your Body/Mind/Spirit are doubled. You cannot however use any magic other than to transform back which takes another round to complete. Any damage taken while in this form will be healed once you transform back.\nAll buffs pre-cast before taking on this form are suspended until the effect ends, then they are restored.\nJewelry buffs are still active when in Giant Form", "sourceFile": "Jotun Abilites.txt"}, {"name": "Frost Giant Fists", "sourceName": "Frost Giant Fist", "category": "Giant", "whoCanCast": "Frost giant --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until dismissed.", "autoHit": "No", "friendlyFire": "N/A", "description": "The fist of a frost giant are as hard as the strongest steel, and can be used to break bones with ease. Those struck with a fist from a frost giant will take an initial 2 Body Damage, the cold from the fist of a frost giant will cover the target causing them to freeze Target must roll a DC: 10 or be frozen in place for 1 turn.\nDoes double damage to slimes\nDoes not count as a spell.", "sourceFile": "Jotun Abilites.txt"}, {"name": "Frost Giant Breath", "sourceName": "Frost Giants Breath", "category": "Frost Giant", "whoCanCast": "Frost Giant ------------------------------------------------------------------------------------", "cost": "Free", "duration": "Instant", "autoHit": "No", "friendlyFire": "Yes", "description": "Frost Giants can unleash their breath weapon in a cone 15ft wide and 30ft long. Anyone caught in the attack will take 2 Body and 2 Spirit, and must roll a DC: 13 or begin to freeze giving them a -2 to attacks and dodges.\nFrost giants can unleash their Breath Weapon every 3 rounds/minutes. \nThe Jotun may use this ability in their Giant Form\nCounts as spell", "sourceFile": "Jotun Abilites.txt"}, {"name": "Weakness Fire", "sourceName": "Weakness: Fire/ Holy Fire / Hellfire", "category": "Giant", "whoCanCast": "Frost Giant and Forst Giant Jarl --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "N/A", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The heat of flames are particularly harmful to Frost Giants. All Forst Giants and Frost Giant Jarls take double Body Damage from Fire-Based, Holy-Fire Based and Hell Fire based attacks and spells. \nWearing Fire Jewelery will negate this Weakness\nDoes not count as a spell.", "sourceFile": "Jotun Abilites.txt"}]}, "Fungal Dryad": {"name": "Fungal Dryad", "family": "Fae", "tier": "Advanced", "abilities": [{"name": "Nature's Step", "sourceName": "Nature's Step", "category": "Fae: Dryad & Fungal Dryad", "whoCanCast": "Fae: Dryad --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Instant", "autoHit": "N/A", "friendlyFire": "N/A", "description": "A Dryad disappears into one plant, only to step out of another within range. The Dryad teleports from one plant to another within 100ft. The Dryad may remain hidden, take another step next turn, or ambush an unaware enemy. When used to ambush, the Dryad may take a +2 to attack a target enemy.\nA plants must be big enough to contain the body of the Dryad. A spell like Oculi Veritatis will reveal the presence of a hidden Dryad.", "sourceFile": "Dryad Abilites.txt"}, {"name": "Talk with animals/plants", "sourceName": "Talk with animals/plants", "category": "Fae: Dryad & Fungal Dryad", "whoCanCast": "Fae: Dryad --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Permanent", "autoHit": "N/A", "friendlyFire": "N/A", "description": "A Dryad can make herself understood by any plant, animal, or monster in its natural habitat. Communication does not guarantee an intelligent, helpful or even truthful response. The Fungal Dryad may also speak to the subterranean mycelium network, allowing them to learn what is hidden beneath their feet.", "sourceFile": "Dryad Abilites.txt"}, {"name": "Decompose", "sourceName": "Decompose", "category": "Fae: Fungal Dryad", "whoCanCast": "N/A --------------------------------------------------------------------------------------------------------------------", "cost": "1 Spirit", "duration": "Variable", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The Fungal Dryad has their Plant Growth ability replaced with Decompose. By speeding up the growth of decomposition factors, the Dryad is able to rot all plant life around her, even harming animal life with fungal infections. May cause all plant life around her to rot in seconds. Up to 100ft radius around the Dryad. This destroys all crops, non-intelligent or non-animate plants. Smaller animals such as insects rats and other vermin will be striken with funagal infections and die. It leaves the area unable to support all but fungal growths for an entire year. The area will be instinctively shunned by mundane animals.\nIf used as an attack against an animal, monster or animate/magical plants, the Dryad must make magical attack on the target, those hit will take 2 Body Damage and then must make a DC13 check or start loosing 2 Body Per Round, until cured or they pass a DC 13 check.", "sourceFile": "Dryad Abilites.txt"}, {"name": "Mycelium Network", "sourceName": "Mycelium Network", "category": "Fae: Fungal Dryad", "whoCanCast": "N/A --------------------------------------------------------------------------------------------------------------------", "cost": "None", "duration": "Permanent", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The Fungal Dryad, has their Plant Life replaced with Mycelium Network. The near omnipresent strands of mycelium beneath their feet and the spores in the air care for and communicate with the Fungal Dryad. Such a being, when reduced to 0 Body will rot over the course of minutes, leaving behind a circle of mushrooms where they fell. The Fungal Dryad will regrow anywhere within the same fungal mycelium network (anywhere on the same continental landmass). The spores in the air continuously communicate the location of close objects to the Dryad. She gains Blind Sight at a range of 60ft.", "sourceFile": "Dryad Abilites.txt"}, {"name": "Fungal Dryad: Undead Traits", "sourceName": "Fungal Dryad: Undead Traits", "category": "Fae: Fungal Dryad", "whoCanCast": "N/A --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "Always active", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Upon loosing it's bonded plant, the Dryad becomes brittle and dried out, taking on an appearance and many traits similar to the undead, leading to it's alternate name, the Undead Dryad. The Fungal Dryad looses it's Weakness: Iron trait and replaces it with Weakness: Fire (Takes double Damage from Elemental Fire and Holy Fire). The Dryad is unable to drink potions, does not need to eat, drink, or breathe, and is immune to non magical diseases and toxins. The dryad may be affected by spells and effects which only affect undead creatures.\nDoes not count as a spell.", "sourceFile": "Dryad Abilites.txt"}]}, "Alux": {"name": "Alux", "family": "Fae", "tier": "Base", "abilities": [{"name": "Plant Growth", "sourceName": "Plant Growth", "category": "Fae / Alux", "whoCanCast": "Alux --------------------------------------------------------------------------------------------------------------------", "cost": "1 Spirit", "duration": "Until they break free.", "autoHit": "Yes", "friendlyFire": "No", "description": "The Alux Fae are able to bless the land around them with bountiful, supernatural fertility, casuing plants to grow months or years in the matter of seconds. When used peacefully they can restore plants to a barren land, bestow a bountiful harvest on friends, or can be used offensively to ensare their enemies in tangling, gripping vines and thorns. Any enemy within a 30ft radius of a point determined by the caster, must roll a DC: 13 or be ensnared untill they break free. They may attempt to break free on their turn by rolling to beat a DC:13 While ensnared they are unable to move their legs and suffer a -3 to all dodge checks.", "sourceFile": "Alux Abilities.txt"}, {"name": "Prank", "sourceName": "Prank", "category": "Fae / Alux", "whoCanCast": "Alux --------------------------------------------------------------------------------------------------------------------", "cost": "1 Spirit", "duration": "Until roll is made", "autoHit": "Yes", "friendlyFire": "N/A", "description": "After 7 years of dutiful service to a farmer, the Alux takes on a more mischeivous streak, causing tools to dull and cattle to sicken. An enemy targeted by Prank must make a DC 11 Check or suffer -1 penalty to their next roll (Combat, DC or Other).", "sourceFile": "Alux Abilities.txt"}, {"name": "Animal Companion", "sourceName": "Animal Companion", "category": "Fae: Pixie", "whoCanCast": "Fae: Pixie/ Alux --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Diurnal/Nocturnal", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Once a day, a Pixie may summon a natural Earth-Realm animal to appear at her side in a cloud of Pixie Dust. It can be no larger than a house cat, has no physical attacks which can cause meaningful damage, but has all the abilities one would expect from their type (dogs have heightened smell, cats can see in the dark, etc. all at the descretion of the DM) and will have stats no higher than 1/1/1. A Summer & Spring Pixie will summon a diurnal type animal (active during the day), while an Autumn & Winter Pixie can summon a nocturnal animal. The animal companion will stay to aid the Pixie until the end of their normal activity cycle (diurnal/nocturnal).\nThe pixie may communicate telepathically with their companion to a range of 1 mile, but information is limited by the understanding and senses of the companion.\nThis ability counts as a spell when casting. The animal cannot be dispelled once it has arrived.", "sourceFile": "Alux Abilities.txt"}, {"name": "Change Size", "sourceName": "Change Size", "category": "Fae: Pixie", "whoCanCast": "Fae: Pixie / Alux --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until size changes again.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Within a cloud of Pixie Dust, the Pixie may, at will (but once per turn), change it's size between it's larger form (approx. 1 ft tall) and it's smaller form (1-3 inches tall). In their larger form they are treated as a normal creature/character. When they are smaller, they gain an AC of 7 due to being harder to hit, but all it's physical attacks are reduced to doing 1 damage, it's land-based movement speed is reduced to 10ft, but flight speed remains unchanged.\nCount as a spell when changing size. But size cannot be dispelled once changed.", "sourceFile": "Alux Abilities.txt"}, {"name": "Flight", "sourceName": "Flight", "category": "Fae: Pixie", "whoCanCast": "Fae: Pixie / Alux --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "At will.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The Pixie's wings can move her at a greater speed than her tiny legs ever could. A pixie has a Flying speed of 40 ft.\nDoes not count as a spell.", "sourceFile": "Alux Abilities.txt"}, {"name": "Weakness: Iron", "sourceName": "Weakness: Iron", "category": "Fae: Pixie / Alux / Changeling", "whoCanCast": "N/A --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "Always active", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Any weapon which is comprised of Iron or Iron alloys (such as steel) will cause double damage to Fae/Pixies.\nDoes not count as a spell.", "sourceFile": "Pixie Abilities.txt"}]}, "Changeling": {"name": "Changeling", "family": "Fae", "tier": "Base", "abilities": [{"name": "Weakness: Iron", "sourceName": "Weakness: Iron", "category": "Fae: Pixie / Alux / Changeling", "whoCanCast": "N/A --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "Always active", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Any weapon which is comprised of Iron or Iron alloys (such as steel) will cause double damage to Fae/Pixies.\nDoes not count as a spell.", "sourceFile": "Pixie Abilities.txt"}, {"name": "Shapeshifting", "sourceName": "Shapeshifting", "category": "Fae", "whoCanCast": "Fae: Changeling --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "N/A", "autoHit": "Yes", "friendlyFire": "N/A", "description": "", "sourceFile": "Changeling Abilites.txt"}, {"name": "Charm", "sourceName": "Charm", "category": "Psionics", "whoCanCast": "Changeling, Vampire, Master Vampire, Tiefling, Succubus, Incubus, Fiend, Archdemon, Angel, Erinyes, Archangel, Lesser Deity, Deity, Sphinx, Arch-Sphinx --------------------------------------------------------------------------------------------------------------------", "cost": "1 Mind", "duration": "Until target breaks free", "autoHit": "Yes", "friendlyFire": "N/A", "description": "Use your mind to charm someone with a look. Those who make eye contact with the caster must roll a DC: 11 or find themselves unable to harm the caster in anyways. They will see this person as someone of extreme importance and love, and do whatever they can to protect them. A Purgo Anima or a Greater Restoration Spell will NOT remove the effect, only time, unless the caster harms the person charmed, then the spell drops automatically. Anyone charmed can make a DC: 17 roll once a day to break out of the effects. This ability cannot be used on someone more powerful then you.\nUndead are immune to Charm", "sourceFile": "Psionics Abilites.txt"}]}, "Dryad": {"name": "Dryad", "family": "Fae", "tier": "Base", "abilities": [{"name": "Plant Growth", "sourceName": "Plant Growth", "category": "Fae / Alux", "whoCanCast": "Alux --------------------------------------------------------------------------------------------------------------------", "cost": "1 Spirit", "duration": "Until they break free.", "autoHit": "Yes", "friendlyFire": "No", "description": "The Alux Fae are able to bless the land around them with bountiful, supernatural fertility, casuing plants to grow months or years in the matter of seconds. When used peacefully they can restore plants to a barren land, bestow a bountiful harvest on friends, or can be used offensively to ensare their enemies in tangling, gripping vines and thorns. Any enemy within a 30ft radius of a point determined by the caster, must roll a DC: 13 or be ensnared untill they break free. They may attempt to break free on their turn by rolling to beat a DC:13 While ensnared they are unable to move their legs and suffer a -3 to all dodge checks.", "sourceFile": "Alux Abilities.txt"}, {"name": "Plant Life", "sourceName": "Plant Life", "category": "Fae: Dryad", "whoCanCast": "Fae: Dryad --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Permanent", "autoHit": "N/A", "friendlyFire": "N/A", "description": "A Dryad has a supernatural life-bond with a plant, traditionally, but not always, a tree. While the bound plant still lives, the Dryad cannot be permanently killed. A Dryad reduced to 0 or less Body will decompose in minutes, and will regrow inside their bonded plant.\nA Dryad who's bonded plant is killed will begin loosing 1 Body per hour over the next 24 hours, a process which is traumatic and can drive many Dryads to insanity. Those who survive this period become an Undead or Fungal Dryad until a new Bond can be formed. \nMagical spells or abilities will not reveal the nature of a bonded plant unless the Dryad is resident within the plant at the time.", "sourceFile": "Dryad Abilites.txt"}]}, "Kitsune": {"name": "Kitsune", "family": "Fae", "tier": "Base", "abilities": [{"name": "Shapeshifting", "sourceName": "Shapeshifting", "category": "Fae", "whoCanCast": "Fae: Changeling --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "N/A", "autoHit": "Yes", "friendlyFire": "N/A", "description": "", "sourceFile": "Changeling Abilites.txt"}, {"name": "Flight", "sourceName": "Flight", "category": "Fae: Pixie", "whoCanCast": "Fae: Pixie / Alux --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "At will.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The Pixie's wings can move her at a greater speed than her tiny legs ever could. A pixie has a Flying speed of 40 ft.\nDoes not count as a spell.", "sourceFile": "Alux Abilities.txt"}, {"name": "Dream Walking", "sourceName": "Dream Walking", "category": "Kitsune", "whoCanCast": "Kitsune --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "1 Day", "autoHit": "Yes", "friendlyFire": "N/A", "description": "", "sourceFile": "Kitsune Abilites.txt"}, {"name": "Claws", "sourceName": "Claws", "category": "Kitsune", "whoCanCast": "Kitsune --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until dismissed.", "autoHit": "No", "friendlyFire": "N/A", "description": "", "sourceFile": "Kitsune Abilites.txt"}]}, "Pixie": {"name": "Pixie", "family": "Fae", "tier": "Base", "abilities": [{"name": "Animal Companion", "sourceName": "Animal Companion", "category": "Fae: Pixie", "whoCanCast": "Fae: Pixie/ Alux --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Diurnal/Nocturnal", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Once a day, a Pixie may summon a natural Earth-Realm animal to appear at her side in a cloud of Pixie Dust. It can be no larger than a house cat, has no physical attacks which can cause meaningful damage, but has all the abilities one would expect from their type (dogs have heightened smell, cats can see in the dark, etc. all at the descretion of the DM) and will have stats no higher than 1/1/1. A Summer & Spring Pixie will summon a diurnal type animal (active during the day), while an Autumn & Winter Pixie can summon a nocturnal animal. The animal companion will stay to aid the Pixie until the end of their normal activity cycle (diurnal/nocturnal).\nThe pixie may communicate telepathically with their companion to a range of 1 mile, but information is limited by the understanding and senses of the companion.\nThis ability counts as a spell when casting. The animal cannot be dispelled once it has arrived.", "sourceFile": "Alux Abilities.txt"}, {"name": "Change Size", "sourceName": "Change Size", "category": "Fae: Pixie", "whoCanCast": "Fae: Pixie / Alux --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until size changes again.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Within a cloud of Pixie Dust, the Pixie may, at will (but once per turn), change it's size between it's larger form (approx. 1 ft tall) and it's smaller form (1-3 inches tall). In their larger form they are treated as a normal creature/character. When they are smaller, they gain an AC of 7 due to being harder to hit, but all it's physical attacks are reduced to doing 1 damage, it's land-based movement speed is reduced to 10ft, but flight speed remains unchanged.\nCount as a spell when changing size. But size cannot be dispelled once changed.", "sourceFile": "Alux Abilities.txt"}, {"name": "Flight", "sourceName": "Flight", "category": "Fae: Pixie", "whoCanCast": "Fae: Pixie / Alux --------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "At will.", "autoHit": "N/A", "friendlyFire": "N/A", "description": "The Pixie's wings can move her at a greater speed than her tiny legs ever could. A pixie has a Flying speed of 40 ft.\nDoes not count as a spell.", "sourceFile": "Alux Abilities.txt"}, {"name": "Weakness: Iron", "sourceName": "Weakness: Iron", "category": "Fae: Pixie / Alux / Changeling", "whoCanCast": "N/A --------------------------------------------------------------------------------------------------------------------", "cost": "N/A", "duration": "Always active", "autoHit": "N/A", "friendlyFire": "N/A", "description": "Any weapon which is comprised of Iron or Iron alloys (such as steel) will cause double damage to Fae/Pixies.\nDoes not count as a spell.", "sourceFile": "Pixie Abilities.txt"}]}, "Deity": {"name": "Deity", "family": "Divine", "tier": "Special", "abilities": [{"name": "Charm", "sourceName": "Charm", "category": "Psionics", "whoCanCast": "Changeling, Vampire, Master Vampire, Tiefling, Succubus, Incubus, Fiend, Archdemon, Angel, Erinyes, Archangel, Lesser Deity, Deity, Sphinx, Arch-Sphinx --------------------------------------------------------------------------------------------------------------------", "cost": "1 Mind", "duration": "Until target breaks free", "autoHit": "Yes", "friendlyFire": "N/A", "description": "Use your mind to charm someone with a look. Those who make eye contact with the caster must roll a DC: 11 or find themselves unable to harm the caster in anyways. They will see this person as someone of extreme importance and love, and do whatever they can to protect them. A Purgo Anima or a Greater Restoration Spell will NOT remove the effect, only time, unless the caster harms the person charmed, then the spell drops automatically. Anyone charmed can make a DC: 17 roll once a day to break out of the effects. This ability cannot be used on someone more powerful then you.\nUndead are immune to Charm", "sourceFile": "Psionics Abilites.txt"}, {"name": "Command", "sourceName": "Command", "category": "Psionics", "whoCanCast": "Abyssal Hellhound, Vampire, Devil, Immortal, Fiend, Archdemon, Archangel, Lesser Deity, Deity, Arch-Sphinx. -----------------------------------------------------------------------------------------------------------------------------------------------------------", "cost": "Free", "duration": "Until completion of the Command", "autoHit": "Yes", "friendlyFire": "N/A", "description": "", "sourceFile": "Psionics Abilites.txt"}, {"name": "Oblivious", "sourceName": "Oblivious", "category": "Psionics", "whoCanCast": "Abyssal Hellhound, Vampire, Fiend, Archdemon, Archangel, Lesser Deity, Deity, Arch-Sphinx -----------------------------------------------------------------------------------------------------------------------------------------------------------", "cost": "2 Mind", "duration": "Until old memories are restored", "autoHit": "Yes", "friendlyFire": "N/A", "description": "Use your mind to rewrite the memories of a target. The false memories are infallible in their content, but inconsistencies may be noticed between new false memories and untouched real memories. Anyone that falls prey to this ability must roll a DC: 13 or fall into a trance as their memories are re-written. A Greater Restoration Potion or a Purgo Anima will reverse the effects. This ability cannot be used on someone stronger then you.\nUndead are immune to this spell.", "sourceFile": "Psionics Abilites.txt"}, {"name": "Suggestion", "sourceName": "Suggestion", "category": "Psionics", "whoCanCast": "Vampire, Devil, Fiend, Archdemon, Archangel, Lesser Deity, Deity, Sphinx, Arch-Sphinx -----------------------------------------------------------------------------------------------------------------------------------------------------------", "cost": "2 Mind", "duration": "Until removed/dispelled", "autoHit": "Yes", "friendlyFire": "N/A", "description": "Use your mind to implant false thoughts or hypnotic suggestions in a target's mind. Target must roll a DC: 13 or become mesmerized and unable to resist the process. A Greater Restoration Potion or a Purgo Anima will reverse the effects. Does not work on those more powerful then you.\nUndead are immune to this spell.", "sourceFile": "Psionics Abilites.txt"}, {"name": "Possession", "sourceName": "Possession", "category": "Psionics", "whoCanCast": "Succubus, Incubus, Devil, Fiend, Archdemon, Erinyes, Archangel, Lesser Deity, Deity. -----------------------------------------------------------------------------------------------------------------------------------------------------------", "cost": "2 Mind", "duration": "Until control is broken", "autoHit": "Yes", "friendlyFire": "N/A", "description": "Possession allows the user to attempt the possession of another living creature by bewildering their mind. Those who fail a DC: 11 roll will find themselves being controlled by the caster. Any creature or person that has free will can attempt to regain control of themselves by making another DC roll every round in which the caster exerts control. Creatures or People made by the Vita Temporaria spell have no free will and thus, receive no DC roll.", "sourceFile": "Psionics Abilites.txt"}, {"name": "Telekinesis", "sourceName": "Telekinesis", "category": "Psionics", "whoCanCast": "Lich, Succubus, Incubus, Abyssal Hellhound, Devil, Immortal, Fiend, Archdemon, Angel, Erinyes, Archangel, Lesser Deity, Deity. -----------------------------------------------------------------------------------------------------------------------------------------------------------", "cost": "Varies", "duration": "As long as upkeep cost is met", "autoHit": "Lifting a Person against their will: Yes Auto Hit: Throwing an Object at a person: No", "friendlyFire": "N/A", "description": "Use your mind to lift and manipulate objects or people off the ground and through the air. If it's a person or living creature, they get to make a DC: 14 to resist the power. Those thrown in this manner take 2 body damage plus 1 extra body for every 20 feet if lifted high off the ground then dropped. Normally lifting someone high into the air takes a few minutes/rounds. 1 round per 20 feet of distance. Cannot be used on those stronger then you.\nSmall O let allPages = [];
let filteredPages = [];
let currentPage = 0;

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
  return escapeHtml(value);
}

function pageIdRace(race) {
  return "race_" + String(race).toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
}

function pageIdAbility(race, ability) {
  return "ability_" + String(race + "_" + ability).toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
}

function buildPages() {
  const stage = document.getElementById("pageStage");
  const races = Object.values(RACE_DATA);

  const grouped = {};
  races.forEach(function (race) {
    grouped[race.family] = grouped[race.family] || [];
    grouped[race.family].push(race);
  });

  let pages = `
    <section class="book-page active" id="race_index">
      <h2 class="item-title">Race Ability Guide</h2>
      <div class="category">Races and abilities for character sheets</div>
      <div class="race-grid">
        ${races.map(function (race) {
          return `
            <button class="race-card" onclick="goToPage('${escapeAttr(pageIdRace(race.name))}')">
              <strong>${escapeHtml(race.name)}</strong>
              ${escapeHtml(race.family)} — ${escapeHtml(race.tier)}<br>
              <small>${race.abilities.length} abilities</small>
            </button>
          `;
        }).join("")}
      </div>
    </section>
  `;

  races.forEach(function (race) {
    pages += `
      <section class="book-page" id="${escapeAttr(pageIdRace(race.name))}">
        <h2 class="item-title">${escapeHtml(race.name)}</h2>
        <div class="category">${escapeHtml(race.family)} → ${escapeHtml(race.tier)}</div>
        <div class="ability-grid">
          ${race.abilities.map(function (ability) {
            return `
              <button class="ability-btn" onclick="goToPage('${escapeAttr(pageIdAbility(race.name, ability.name))}')">
                <strong>${escapeHtml(ability.name)}</strong>
                <small>${escapeHtml(ability.cost || "Free")} • ${escapeHtml(ability.category || "Race Ability")}</small>
              </button>
            `;
          }).join("")}
        </div>
      </section>
    `;

    race.abilities.forEach(function (ability) {
      pages += `
        <section class="book-page" id="${escapeAttr(pageIdAbility(race.name, ability.name))}">
          <h2 class="item-title">${escapeHtml(ability.name)}</h2>
          <div class="category">${escapeHtml(race.name)} → ${escapeHtml(race.family)}</div>
          <table class="field-table">
            <tr><th>Source Ability</th><td>${escapeHtml(ability.sourceName || ability.name)}</td></tr>
            <tr><th>Category</th><td>${escapeHtml(ability.category || "")}</td></tr>
            <tr><th>Who Can Cast</th><td>${escapeHtml(ability.whoCanCast || "N/A")}</td></tr>
            <tr><th>Cost</th><td>${escapeHtml(ability.cost || "N/A")}</td></tr>
            <tr><th>Duration</th><td>${escapeHtml(ability.duration || "N/A")}</td></tr>
            <tr><th>Auto Hit</th><td>${escapeHtml(ability.autoHit || "N/A")}</td></tr>
            <tr><th>Friendly Fire</th><td>${escapeHtml(ability.friendlyFire || "N/A")}</td></tr>
            <tr><th>Description</th><td class="preserve-lines">${escapeHtml(ability.description || "No description listed.")}</td></tr>
          </table>
        </section>
      `;
    });
  });

  stage.innerHTML = pages;
  allPages = Array.from(document.querySelectorAll(".book-page"));
  filteredPages = allPages.slice();
  showPage(0);
}

function goToPage(id) {
  const page = document.getElementById(id);
  if (!page) return;
  filteredPages = allPages.slice();
  const index = filteredPages.indexOf(page);
  showPage(index >= 0 ? index : 0);
}

function showPage(index) {
  if (filteredPages.length === 0) {
    allPages.forEach(p => p.classList.remove("active"));
    document.getElementById("pageCount").textContent = "No pages";
    return;
  }
  if (index < 0) index = filteredPages.length - 1;
  if (index >= filteredPages.length) index = 0;
  currentPage = index;
  allPages.forEach(p => p.classList.remove("active"));
  filteredPages[currentPage].classList.add("active");
  document.getElementById("pageCount").textContent = "Page " + (currentPage + 1) + " of " + filteredPages.length;
}

function nextPage() { showPage(currentPage + 1); }
function prevPage() { showPage(currentPage - 1); }

function searchPages() {
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  if (!q) {
    filteredPages = allPages.slice();
  } else {
    filteredPages = allPages.filter(page => page.textContent.toLowerCase().includes(q));
  }
  showPage(0);
}

window.addEventListener("DOMContentLoaded", buildPages);
</script>
